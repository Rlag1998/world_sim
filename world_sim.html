<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE CHRONICLE ENGINE — a procedural world</title>
<style>
:root{
  --bg:#0a0907; --bg2:#100e0b; --panel:#15120d; --panel2:#1c1811;
  --edge:#2c2618; --edge2:#3d3421;
  --ink:#d9cfb6; --ink-dim:#8d8471; --ink-faint:#5f5847;
  --gold:#c9a247; --gold-dim:#8a6f30;
  --blood:#b04030; --blood-dim:#6e281e;
  --sea:#2c5570; --leaf:#4d7a3a; --frost:#7fa8c0; --arcane:#8a6fc0;
  --hl:#e8dcc0;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, "DejaVu Sans Mono", "Liberation Mono", monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(1200px 700px at 20% -10%, #17130c 0%, transparent 60%),
    radial-gradient(900px 600px at 110% 110%, #14110b 0%, transparent 55%),
    var(--bg);
  color:var(--ink); font-family:var(--mono); font-size:13px; line-height:1.45;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0d0b08}
::-webkit-scrollbar-thumb{background:#2e2718;border:1px solid #3a3120}
::-webkit-scrollbar-thumb:hover{background:#443a24}

#app{display:flex;flex-direction:column;height:100%}

/* ---------- top bar ---------- */
#topbar{
  display:flex;align-items:center;gap:10px;padding:6px 10px;
  background:linear-gradient(#191509,#100d08);
  border-bottom:1px solid var(--edge2); flex:0 0 auto; flex-wrap:wrap;
}
#brand{font-weight:700;letter-spacing:.22em;color:var(--gold);white-space:nowrap;text-shadow:0 0 14px rgba(201,162,71,.25)}
#brand small{display:block;letter-spacing:.12em;color:var(--ink-faint);font-weight:400;font-size:9px}
.grp{display:flex;align-items:center;gap:4px}
.sep{width:1px;height:22px;background:var(--edge2)}
.btn{
  background:linear-gradient(#221d12,#181409);border:1px solid var(--edge2);
  color:var(--ink);padding:3px 9px;cursor:pointer;border-radius:2px;white-space:nowrap;
}
.btn:hover{border-color:var(--gold-dim);color:var(--hl);background:linear-gradient(#2c2514,#201a0e)}
.btn:active{transform:translateY(1px)}
.btn.on{border-color:var(--gold);color:var(--gold);box-shadow:inset 0 0 12px rgba(201,162,71,.14)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:1px 6px;font-size:11px}
input[type=text],input[type=number],select{
  background:#0b0906;border:1px solid var(--edge2);padding:3px 6px;border-radius:2px;color:var(--ink)
}
input[type=text]:focus,input[type=number]:focus{outline:none;border-color:var(--gold-dim)}
label.lb{color:var(--ink-faint);font-size:11px;letter-spacing:.08em}
#clock{color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
#clock b{font-size:15px}
#era{color:var(--ink-dim);font-size:11px}

/* ---------- main ---------- */
#main{display:flex;flex:1 1 auto;min-height:0}
#left{display:flex;flex-direction:column;flex:1 1 auto;min-width:0;border-right:1px solid var(--edge2)}
#modebar{display:flex;gap:2px;padding:4px 6px;background:var(--bg2);border-bottom:1px solid var(--edge);overflow-x:auto;flex:0 0 auto}
.mode{background:transparent;border:1px solid transparent;color:var(--ink-faint);padding:2px 7px;cursor:pointer;white-space:nowrap;border-radius:2px;font-size:11px;letter-spacing:.06em}
.mode:hover{color:var(--ink)}
.mode.on{color:var(--gold);border-color:var(--edge2);background:#1a1509}
#mapwrap{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#06050a;cursor:crosshair}
#map{display:block;position:absolute;left:0;top:0}
#hover{
  position:absolute;pointer-events:none;background:rgba(8,7,5,.96);border:1px solid var(--edge2);
  padding:5px 8px;font-size:11px;max-width:340px;display:none;z-index:20;box-shadow:0 6px 22px #000;white-space:pre-wrap;line-height:1.4
}
#minimap{position:absolute;right:8px;top:8px;border:1px solid var(--edge2);background:#06050a;opacity:.9;z-index:10;cursor:pointer}
#legend{
  flex:0 0 auto;padding:4px 8px;background:var(--bg2);border-top:1px solid var(--edge);
  font-size:11px;color:var(--ink-dim);display:flex;gap:10px;flex-wrap:wrap;max-height:56px;overflow:auto;align-items:center
}
#legend i{font-style:normal;display:inline-block;width:9px;text-align:center;margin-right:3px}
#gennote{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(6,5,4,.92);z-index:30}
#gennote .t{color:var(--gold);letter-spacing:.3em}
#bar{width:420px;max-width:70vw;height:3px;background:#221d12;border:1px solid var(--edge2)}
#bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--gold-dim),var(--gold))}
#genmsg{color:var(--ink-dim);font-size:11px;min-height:16px}

/* ---------- right ---------- */
#right{flex:0 0 430px;display:flex;flex-direction:column;background:var(--panel);min-width:0}
#tabs{display:flex;border-bottom:1px solid var(--edge2);background:var(--bg2);flex:0 0 auto}
.tab{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--ink-faint);padding:5px 2px;cursor:pointer;font-size:11px;letter-spacing:.1em}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);background:#191408}
.pane{flex:1 1 auto;overflow:auto;padding:8px 10px;display:none}
.pane.on{display:block}
#chronicle .ev{margin:0 0 4px;padding:1px 0 1px 22px;text-indent:-22px;font-size:12px;color:var(--ink-dim);line-height:1.5}
#chronicle .ev .yr{display:inline-block;width:46px;text-indent:0;color:var(--ink-faint);font-variant-numeric:tabular-nums}
#chronicle .ev .mk{display:inline-block;width:16px;text-indent:0;font-style:normal;text-align:center;opacity:.85}
.yrhead{display:flex;align-items:center;gap:8px;margin:14px 0 6px;color:var(--gold-dim);
  font-size:10.5px;letter-spacing:.22em;text-transform:uppercase}
.yrhead:first-of-type{margin-top:4px}
.yrhead:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--edge2),transparent)}
.ev.s3{color:var(--ink)}
.ev.s4{color:var(--hl)}
.ev.s5{color:var(--gold);background:linear-gradient(90deg,rgba(201,162,71,.07),transparent);
  border-left:2px solid var(--gold-dim);padding-left:20px;margin-left:-22px;text-indent:0}
.ev.s5 .mk{color:var(--gold)}
.k-war .mk{color:#d89070}
.k-doom .mk{color:#c05242}
.k-crown .mk{color:#d8b45a}
.k-faith .mk{color:#d8b98a}
.k-myth .mk{color:#a98ad8}
.k-lore .mk{color:#8ab0c8}
.k-folk .mk{color:#9ab48a}
.k-peace .mk{color:#8ac0a8}
.ev.k-doom{color:#c98878}
.ev.s5.k-doom{color:#e08a70;border-left-color:var(--blood-dim);
  background:linear-gradient(90deg,rgba(176,64,48,.10),transparent)}
.intro{border:1px solid var(--edge2);background:#191408;padding:8px 10px;margin:6px 0 10px;font-size:12px;line-height:1.55}
.intro b{color:var(--gold)}
.intro ol{margin:6px 0 6px 16px;padding:0}
.intro li{margin:2px 0}
a.lk{color:var(--gold);cursor:pointer;text-decoration:none;border-bottom:1px dotted rgba(201,162,71,.35)}
a.lk:hover{color:#f0d48a;background:rgba(201,162,71,.1)}
a.lk.p{color:#9fc0da;border-bottom-color:rgba(159,192,218,.3)}
a.lk.c{color:#b6a0d8;border-bottom-color:rgba(182,160,216,.3)}
a.lk.s{color:#9ec48a;border-bottom-color:rgba(158,196,138,.3)}
a.lk.f{color:#d8b98a;border-bottom-color:rgba(216,185,138,.3)}
a.lk.a{color:#d88a8a;border-bottom-color:rgba(216,138,138,.3)}
h3.hd{margin:0 0 6px;color:var(--gold);font-size:13px;letter-spacing:.14em;border-bottom:1px solid var(--edge2);padding-bottom:3px;font-weight:600}
h4.sub{margin:10px 0 3px;color:var(--ink-dim);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.kv{display:grid;grid-template-columns:112px 1fr;gap:1px 8px;font-size:12px}
.kv .k{color:var(--ink-faint)}
.kv .v{color:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-size:11.5px}
table.t th{text-align:left;color:var(--ink-faint);font-weight:400;border-bottom:1px solid var(--edge);padding:2px 4px;position:sticky;top:-8px;background:var(--panel)}
table.t td{padding:1px 4px;border-bottom:1px solid #1a160f;vertical-align:top}
table.t tr:hover td{background:#1b1710}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;background:#1c1810;border:1px solid var(--edge);position:relative;overflow:hidden}
.bar>span{position:absolute;left:0;top:0;bottom:0;background:var(--gold-dim)}
.tag{display:inline-block;border:1px solid var(--edge2);padding:0 4px;margin:1px 2px 1px 0;font-size:10.5px;color:var(--ink-dim);border-radius:2px}
.tag.g{color:var(--gold);border-color:var(--gold-dim)}
.tag.b{color:var(--blood);border-color:var(--blood-dim)}
.tag.a{color:var(--arcane);border-color:#4c3b6b}
.tree{font-size:11.5px;white-space:pre;line-height:1.35;color:var(--ink-dim);overflow:auto}
.quote{border-left:2px solid var(--gold-dim);padding:2px 0 2px 8px;margin:5px 0;color:var(--ink-dim);font-style:italic}
.crumb{font-size:11px;color:var(--ink-faint);margin-bottom:4px}
.crumb a{cursor:pointer;color:var(--gold-dim)}
.crumb a:hover{color:var(--gold)}
.muted{color:var(--ink-faint)}
.dead{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:rgba(176,64,48,.5)}
#statusbar{
  flex:0 0 auto;display:flex;gap:14px;padding:3px 10px;font-size:11px;color:var(--ink-faint);
  background:linear-gradient(#0e0c08,#141009);border-top:1px solid var(--edge2);flex-wrap:wrap
}
#statusbar b{color:var(--ink-dim);font-weight:400}
.spark{display:inline-block;vertical-align:middle}
.rowbtns{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
#searchbox{width:100%;margin-bottom:6px}
.hint{font-size:10.5px;color:var(--ink-faint);margin-top:2px}
@media (max-width:1100px){ #right{flex-basis:340px} }
@media (max-width:820px){ #main{flex-direction:column} #right{flex:1 1 auto;border-top:1px solid var(--edge2)} }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="brand">THE CHRONICLE ENGINE<small>a world that writes itself</small></div>
    <div class="sep"></div>
    <div class="grp">
      <label class="lb">SEED</label>
      <input type="text" id="seed" size="10" value="">
      <button class="btn" id="btnGen">FORGE WORLD</button>
      <button class="btn sm" id="btnRandom">&#9860;</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button class="btn" id="btnPlay">&#9654; RUN</button>
      <button class="btn sm" id="btnStep">+1y</button>
      <button class="btn sm" id="btnStep10">+10y</button>
      <button class="btn sm" id="btnStep100">+100y</button>
      <button class="btn sm" id="btnStep500">+500y</button>
      <label class="lb">SPD</label>
      <input type="range" id="speed" min="1" max="8" value="4" style="width:80px">
    </div>
    <div class="sep"></div>
    <div id="clock"><b>Year 0</b> <span id="mon">Frostmoon</span></div>
    <div id="era"></div>
    <div style="flex:1"></div>
    <div class="grp">
      <button class="btn sm" id="btnHelp">?</button>
    </div>
  </div>

  <div id="main">
    <div id="left">
      <div id="modebar"></div>
      <div id="mapwrap">
        <canvas id="map"></canvas>
        <canvas id="minimap" width="200" height="114"></canvas>
        <div id="hover"></div>
        <div id="gennote">
          <div class="t">FORGING THE WORLD</div>
          <div id="bar"><div></div></div>
          <div id="genmsg">&nbsp;</div>
        </div>
      </div>
      <div id="legend"></div>
    </div>
    <div id="right">
      <div id="tabs">
        <button class="tab on" data-p="chronicle">CHRONICLE</button>
        <button class="tab" data-p="inspect">INSPECT</button>
        <button class="tab" data-p="world">WORLD</button>
        <button class="tab" data-p="search">SEARCH</button>
      </div>
      <div class="pane on" id="chronicle"></div>
      <div class="pane" id="inspect"></div>
      <div class="pane" id="world"></div>
      <div class="pane" id="search"></div>
      <div id="statusbar"></div>
    </div>
  </div>
</div>
<script>
'use strict';
/* ============================================================================
   THE CHRONICLE ENGINE
   A fully procedural, fully simulated, text-rendered fantasy world.
   Everything below is derived from a single integer seed.
   ========================================================================== */

/* ---------------------------------------------------------------- constants */
const W = 280, H = 160, NT = W * H;          // world grid (wraps in x)
const SEA_TARGET = 0.315;                     // fraction of tiles that are land
const MONTHS = ['Frostmoon','Thawmoon','Seedmoon','Blossom','Longsun','Highsun',
                'Harvestide','Goldfall','Duskmoon','Emberfall','Rimefall','Deepnight'];

/* -------------------------------------------------------------------- maths */
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const smooth= t=> t*t*(3-2*t);
const sat   = v=> v<0?0:(v>1?1:v);
const sq    = v=> v*v;
function wrapx(x){ x%=W; return x<0?x+W:x; }
function idx(x,y){ return wrapx(x) + y*W; }
function tx(i){ return i % W; }
function ty(i){ return (i / W) | 0; }
/* Latitude in [-1,1]. The grid is an equal-area cylindrical projection: rows
   near the poles cover more degrees each, so the map does not squander a fifth
   of the world on ice nobody will ever live in. */
const LATT=new Float32Array(H);
for(let y=0;y<H;y++) LATT[y]=Math.asin(clamp(1-2*(y+0.5)/H,-1,1))/1.5707963;
function latOf(y){ return LATT[y|0]; }

const N8X=[1,1,0,-1,-1,-1,0,1], N8Y=[0,1,1,1,0,-1,-1,-1];
const N4X=[1,0,-1,0], N4Y=[0,1,0,-1];
const N8D=[1,1.41421,1,1.41421,1,1.41421,1,1.41421];

/* Iterate the 8 neighbours of i, calling f(j, dir). Skips off-world rows. */
function nb8(i,f){
  const x=i%W, y=(i/W)|0;
  for(let d=0;d<8;d++){
    const ny=y+N8Y[d]; if(ny<0||ny>=H) continue;
    f(wrapx(x+N8X[d]) + ny*W, d);
  }
}
function nb4(i,f){
  const x=i%W, y=(i/W)|0;
  for(let d=0;d<4;d++){
    const ny=y+N4Y[d]; if(ny<0||ny>=H) continue;
    f(wrapx(x+N4X[d]) + ny*W, d);
  }
}
/* toroidal-in-x distance */
function dxw(ax,bx){ let d=ax-bx; if(d>W/2)d-=W; if(d<-W/2)d+=W; return d; }
function tdist(a,b){ const dx=dxw(a%W,b%W), dy=((a/W)|0)-((b/W)|0); return Math.sqrt(dx*dx+dy*dy); }
function tdist2(a,b){ const dx=dxw(a%W,b%W), dy=((a/W)|0)-((b/W)|0); return dx*dx+dy*dy; }

/* ------------------------------------------------------------------ hashing */
function h32(a){ a|=0; a=Math.imul(a^(a>>>16),0x21f0aaad); a=Math.imul(a^(a>>>15),0x735a2d97); return (a^(a>>>15))>>>0; }
function h2(x,y,s){ return h32(Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(s,2246822519)); }
function h3(x,y,z,s){ return h32(Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(z,2147483647)^Math.imul(s,2246822519)); }
function hashStr(str,seed){
  let h = h32(seed|0) ^ 0x811c9dc5;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,0x01000193)>>>0; }
  return h>>>0;
}

/* -------------------------------------------------------------------- PRNGs */
function splitmix32(a){
  return function(){
    a = (a + 0x9e3779b9) | 0;
    let t = a ^ (a>>>16); t = Math.imul(t,0x21f0aaad);
    t = t ^ (t>>>15);     t = Math.imul(t,0x735a2d97);
    return ((t ^ (t>>>15))>>>0) / 4294967296;
  };
}
/* Named substream: adding a new system never reshuffles the others. */
function stream(seed,name){ return splitmix32(hashStr(name,seed)|0); }

const ri = (r,a,b)=> a + ((r()*(b-a+1))|0);            // inclusive int
const rf = (r,a,b)=> a + r()*(b-a);
const pick = (r,arr)=> arr[(r()*arr.length)|0];
const chance = (r,p)=> r() < p;
function shuffle(r,arr){ for(let i=arr.length-1;i>0;i--){ const j=(r()*(i+1))|0; const t=arr[i];arr[i]=arr[j];arr[j]=t; } return arr; }
function gauss(r,mu,sd){ let u=1-r(),v=r(); return mu + sd*Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307*v); }
function pickW(r,arr,wf){
  let tot=0; for(let i=0;i<arr.length;i++) tot+=Math.max(0,wf(arr[i],i));
  if(tot<=0) return arr[(r()*arr.length)|0];
  let t=r()*tot;
  for(let i=0;i<arr.length;i++){ t-=Math.max(0,wf(arr[i],i)); if(t<=0) return arr[i]; }
  return arr[arr.length-1];
}
function pickIdxW(r,weights){
  let tot=0; for(let i=0;i<weights.length;i++) tot+=Math.max(0,weights[i]);
  if(tot<=0) return (r()*weights.length)|0;
  let t=r()*tot;
  for(let i=0;i<weights.length;i++){ t-=Math.max(0,weights[i]); if(t<=0) return i; }
  return weights.length-1;
}
/* deterministic sample of k distinct items */
function sampleK(r,arr,k){
  const a=arr.slice(); const out=[];
  k=Math.min(k,a.length);
  for(let i=0;i<k;i++){ const j=i+((r()*(a.length-i))|0); const t=a[i];a[i]=a[j];a[j]=t; out.push(a[i]); }
  return out;
}

/* --------------------------------------------------------- cylindrical noise
   x wraps around the world, so we sample noise on a cylinder in 3-space.
   One shuffled permutation table serves the whole world; different callers
   ask for different regions of it by passing an integer offset. Three array
   lookups per lattice corner beats fifteen integer multiplies.               */
let NP=null, NPSEED=null;
function noiseInit(seed){
  if(NPSEED===seed && NP) return;
  const p=new Uint8Array(256);
  for(let i=0;i<256;i++) p[i]=i;
  const r=splitmix32(h32(seed)|0);
  for(let i=255;i>0;i--){ const j=(r()*(i+1))|0; const t=p[i]; p[i]=p[j]; p[j]=t; }
  NP=new Uint8Array(512);
  for(let i=0;i<512;i++) NP[i]=p[i&255];
  NPSEED=seed;
}
const NINV=1/255;
function vn3(x,y,z,off){
  const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
  const xf=smooth(x-xi), yf=smooth(y-yi), zf=smooth(z-zi);
  const X=(xi+off)&255, Y=(yi+off)&255, Z=(zi+off)&255;
  const X1=(X+1)&255, Y1=(Y+1)&255, Z1=(Z+1)&255;
  const A=NP[X]+Y, B=NP[X1]+Y;
  const AA=NP[A&255]+Z, AB=NP[(A+1)&255]+Z, BA=NP[B&255]+Z, BB=NP[(B+1)&255]+Z;
  const c000=NP[AA&255], c010=NP[AB&255], c100=NP[BA&255], c110=NP[BB&255];
  const c001=NP[(AA+1)&255], c011=NP[(AB+1)&255], c101=NP[(BA+1)&255], c111=NP[(BB+1)&255];
  const x00=c000+(c100-c000)*xf, x10=c010+(c110-c010)*xf;
  const x01=c001+(c101-c001)*xf, x11=c011+(c111-c011)*xf;
  const y0=x00+(x10-x00)*yf, y1=x01+(x11-x01)*yf;
  return (y0+(y1-y0)*zf)*NINV;
}
const TAU=6.283185307, NR=W/TAU;
/* fBm sampled on the cylinder for a tile (px,py). freq = cycles around world */
function fbm(px,py,seed,octaves,freq,gain,lac){
  gain=gain||0.5; lac=lac||2.0;
  const ang=px*(TAU/W);
  const ca=Math.cos(ang)*NR, sa=Math.sin(ang)*NR;
  const base=h32(seed)&255;
  let amp=1, tot=0, norm=0, f=freq*0.06;
  for(let o=0;o<octaves;o++){
    tot  += amp * vn3(ca*f, py*f, sa*f, (base+o*37)&255);
    norm += amp; amp*=gain; f*=lac;
  }
  return tot/norm;
}
/* ridged variant for mountain texture */
function ridge(px,py,seed,octaves,freq){
  const ang=px*(TAU/W);
  const ca=Math.cos(ang)*NR, sa=Math.sin(ang)*NR;
  const base=h32(seed^0x9e37)&255;
  let amp=1,tot=0,norm=0,f=freq*0.06;
  for(let o=0;o<octaves;o++){
    const v=Math.abs(vn3(ca*f,py*f,sa*f,(base+o*53)&255)*2-1);
    tot += amp*(1-v); norm+=amp; amp*=0.5; f*=2.1;
  }
  return tot/norm;
}

/* ------------------------------------------------------------- binary heaps */
class MinHeap {
  constructor(cap){ this.k=new Float64Array(cap||1024); this.v=new Int32Array(cap||1024); this.n=0; }
  _grow(){ const k=new Float64Array(this.k.length*2), v=new Int32Array(this.v.length*2);
           k.set(this.k); v.set(this.v); this.k=k; this.v=v; }
  push(key,val){
    if(this.n===this.k.length) this._grow();
    let i=this.n++; this.k[i]=key; this.v[i]=val;
    while(i>0){ const p=(i-1)>>1; if(this.k[p]<=this.k[i]) break;
      const tk=this.k[p];this.k[p]=this.k[i];this.k[i]=tk;
      const tv=this.v[p];this.v[p]=this.v[i];this.v[i]=tv; i=p; }
  }
  pop(){
    const top=this.v[0], tk=this.k[0];
    this.n--;
    if(this.n>0){
      this.k[0]=this.k[this.n]; this.v[0]=this.v[this.n];
      let i=0;
      for(;;){ const l=2*i+1,r=l+1; let m=i;
        if(l<this.n&&this.k[l]<this.k[m])m=l;
        if(r<this.n&&this.k[r]<this.k[m])m=r;
        if(m===i)break;
        const a=this.k[m];this.k[m]=this.k[i];this.k[i]=a;
        const b=this.v[m];this.v[m]=this.v[i];this.v[i]=b; i=m; }
    }
    this._k=tk; return top;
  }
  get size(){ return this.n; }
}

/* ----------------------------------------------------------------- strings  */
function cap(s){ return s? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function roman(n){
  if(n<1) return '';
  const v=[1000,900,500,400,100,90,50,40,10,9,5,4,1];
  const s=['M','CM','D','CD','C','XC','L','XL','X','IX','V','IV','I'];
  let out=''; for(let i=0;i<v.length;i++) while(n>=v[i]){ out+=s[i]; n-=v[i]; }
  return out;
}
function commify(n){
  n=Math.round(n);
  if(Math.abs(n)>=1e9) return (n/1e9).toFixed(2)+'B';
  if(Math.abs(n)>=1e6) return (n/1e6).toFixed(2)+'M';
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function pct(v){ return Math.round(v*100)+'%'; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ordinal(n){
  const s=['th','st','nd','rd'], v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}
function listify(a){
  if(!a.length) return '';
  if(a.length===1) return a[0];
  if(a.length===2) return a[0]+' and '+a[1];
  return a.slice(0,-1).join(', ')+', and '+a[a.length-1];
}
function plural(n,s,p){ return n===1? '1 '+s : commify(n)+' '+(p||s+'s'); }

/* ----------------------------------------------------------------- palettes */
/* Colour is quantised to a fixed palette so the glyph atlas stays small.      */
const PAL = [];
function palAdd(hex){ PAL.push(hex); return PAL.length-1; }
function mixHex(a,b,t){
  const ar=(a>>16)&255, ag=(a>>8)&255, ab=a&255;
  const br=(b>>16)&255, bg=(b>>8)&255, bb=b&255;
  return (((ar+(br-ar)*t)|0)<<16) | (((ag+(bg-ag)*t)|0)<<8) | ((ab+(bb-ab)*t)|0);
}
function hexs(v){ return '#'+('000000'+(v>>>0).toString(16)).slice(-6); }
/* build a ramp of n colours between hex a and b, return the first index */
function palRamp(a,b,n){
  const start=PAL.length;
  for(let i=0;i<n;i++) palAdd(mixHex(a,b,n===1?0:i/(n-1)));
  return start;
}
/* HSL -> RGB int, used for the many distinct polity / culture colours */
function hsl(h,s,l){
  h=((h%1)+1)%1;
  const c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs(((h*6)%2)-1)), m=l-c/2;
  let r,g,b;
  const seg=(h*6)|0;
  if(seg===0){r=c;g=x;b=0} else if(seg===1){r=x;g=c;b=0} else if(seg===2){r=0;g=c;b=x}
  else if(seg===3){r=0;g=x;b=c} else if(seg===4){r=x;g=0;b=c} else {r=c;g=0;b=x}
  return (((r+m)*255|0)<<16)|(((g+m)*255|0)<<8)|(((b+m)*255)|0);
}

/* --------------------------------------------------------- small containers */
/* Bounded ring of recent items, used for per-entity event indices. */
function ringPush(arr,v,max){ arr.push(v); if(arr.length>max) arr.shift(); return arr; }

/* Sorted top-K without full sort. */
function topK(items,k,score){
  const out=[];
  for(let i=0;i<items.length;i++){
    const s=score(items[i]); if(s===null||s===undefined||s!==s) continue;
    if(out.length<k){ out.push([s,items[i]]); if(out.length===k) out.sort((a,b)=>b[0]-a[0]); }
    else if(s>out[k-1][0]){
      out[k-1]=[s,items[i]];
      for(let j=k-1;j>0&&out[j][0]>out[j-1][0];j--){ const t=out[j];out[j]=out[j-1];out[j-1]=t; }
    }
  }
  if(out.length<k) out.sort((a,b)=>b[0]-a[0]);
  return out.map(o=>o[1]);
}

/* ------------------------------------------------------------------ genesis */
let SEA = 0.5;
let RIVMIN = 26, RIVBIG = 120, RIVNAV = 400;
let PLATES = [];
let HOTSPOTS = [];

function* worldgen(seed){
  allocTiles();
  noiseInit(seed);
  const R = s=>stream(seed,s);
  /* Tongues and kindreds are invented before the rock, because the Powers who
     broke the world had names, and names need a language to be in. */
  yield [0.005,'the first tongues are spoken'];
  {
    const r0=R('bootstrap');
    langFamilies(seed, ri(r0,3,4), ri(r0,14,20));
    genSpecies(seed);
  }

  /* ---- 1. plates ------------------------------------------------------- */
  yield [0.02,'the crust congeals; plates take shape'];
  {
    const r=R('plates');
    const np = ri(r,11,17);
    PLATES=[];
    const cand=[];
    for(let k=0;k<np*14;k++) cand.push([ri(r,0,W-1),ri(r,0,H-1)]);
    /* Mitchell's best-candidate for even but irregular spacing */
    const chosen=[];
    for(let k=0;k<np;k++){
      let best=null,bd=-1;
      for(let c=0;c<12;c++){
        const p=cand[(k*12+c)%cand.length];
        let d=1e9;
        for(const q of chosen){ const dd=Math.min(d, sq(dxw(p[0],q[0]))+sq(p[1]-q[1])); d=dd; }
        if(d>bd){bd=d;best=p;}
      }
      chosen.push(best);
    }
    for(let k=0;k<np;k++){
      const oceanic = chance(r,0.55);
      const a=rf(r,0,6.2832), sp=rf(r,0.35,1.0);
      PLATES.push({
        id:k, x:chosen[k][0], y:chosen[k][1], oceanic,
        dx:Math.cos(a)*sp, dy:Math.sin(a)*sp*0.7,
        base: oceanic? rf(r,0.10,0.24) : rf(r,0.56,0.70),
        area:0
      });
    }
    /* Voronoi with a little noise so boundaries are not straight lines */
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const i=x+y*W;
      const jx = x + (fbm(x,y,seed^0x5f3a,3,3.0)-0.5)*22;
      const jy = y + (fbm(x,y,seed^0x91c2,3,3.0)-0.5)*22;
      let bp=0,bd=1e18;
      for(let k=0;k<np;k++){
        const p=PLATES[k];
        const d=sq(dxw(jx,p.x))+sq(jy-p.y);
        if(d<bd){bd=d;bp=k;}
      }
      T.plate[i]=bp; PLATES[bp].area++;
    }
  }

  /* ---- 2. boundary stress ---------------------------------------------- */
  yield [0.06,'continents collide; mountains are born in stone'];
  {
    const heap=new MinHeap(NT);
    const nearStress=new Float32Array(NT);
    const dist=new Float32Array(NT).fill(1e9);
    for(let i=0;i<NT;i++){
      const pa=T.plate[i]; let s=0,cnt=0;
      const x=i%W,y=(i/W)|0;
      for(let d=0;d<8;d++){
        const ny=y+N8Y[d]; if(ny<0||ny>=H) continue;
        const j=wrapx(x+N8X[d])+ny*W;
        const pb=T.plate[j]; if(pb===pa) continue;
        const A=PLATES[pa],Bp=PLATES[pb];
        let ux=N8X[d],uy=N8Y[d]; const ul=Math.hypot(ux,uy); ux/=ul; uy/=ul;
        // positive => A drives into B (convergent)
        const conv = (A.dx-Bp.dx)*ux + (A.dy-Bp.dy)*uy;
        let mag = conv;
        if(conv>0){
          if(!A.oceanic && !Bp.oceanic) mag*=2.35;        // continental collision
          else if(A.oceanic && !Bp.oceanic) mag*=0.45;    // A subducts: trench on A
          else if(!A.oceanic && Bp.oceanic) mag*=1.75;    // arc on A
          else mag*=0.95;                                  // island arc
        } else {
          mag *= (A.oceanic&&Bp.oceanic)? 0.55 : 1.15;    // ridge vs continental rift
        }
        s+=mag; cnt++;
      }
      if(cnt){ nearStress[i]=s/cnt; dist[i]=0; heap.push(0,i); }
    }
    /* Dijkstra spread of the nearest boundary's stress */
    const stressOf=new Float32Array(NT);
    for(let i=0;i<NT;i++) stressOf[i]=nearStress[i];
    while(heap.size){
      const i=heap.pop(); const di=heap._k;
      if(di>dist[i]+1e-6) continue;
      const x=i%W,y=(i/W)|0;
      for(let d=0;d<8;d++){
        const ny=y+N8Y[d]; if(ny<0||ny>=H) continue;
        const j=wrapx(x+N8X[d])+ny*W;
        const nd=di+N8D[d];
        if(nd<dist[j]-1e-6 && nd<26){ dist[j]=nd; stressOf[j]=stressOf[i]; heap.push(nd,j); }
      }
    }
    for(let i=0;i<NT;i++){
      const s=stressOf[i], d=dist[i];
      const fall = Math.exp(-d/(s>0? 6.5 : 4.0));
      T.stress[i] = s*fall;
    }
  }

  /* ---- 3. elevation ----------------------------------------------------- */
  yield [0.11,'the bones of the world settle'];
  {
    const r=R('hotspots');
    HOTSPOTS=[];
    const nh=ri(r,4,8);
    for(let k=0;k<nh;k++) HOTSPOTS.push({x:ri(r,0,W-1),y:ri(r,18,H-19),
      dx:rf(r,-1,1),dy:rf(r,-.4,.4),str:rf(r,0.20,0.44),len:ri(r,8,26)});
    /* paint the plume chains once, not once per tile */
    const hs=new Float32Array(NT);
    for(const hp of HOTSPOTS){
      for(let s=0;s<hp.len;s++){
        const hx=Math.round(hp.x+hp.dx*s*1.6), hy=Math.round(hp.y+hp.dy*s*1.6);
        if(hy<1||hy>=H-1) continue;
        const amp=hp.str*(1-s/(hp.len+4));
        for(let dy=-5;dy<=5;dy++){
          const y=hy+dy; if(y<0||y>=H) continue;
          for(let dx=-5;dx<=5;dx++){
            const d2=dx*dx+dy*dy; if(d2>30) continue;
            hs[wrapx(hx+dx)+y*W]+=amp*Math.exp(-d2/9);
          }
        }
      }
    }
    for(let y=0;y<H;y++){
      const l=Math.abs(latOf(y));
      const polar = l>0.93? (l-0.93)*1.6 : 0;
      for(let x=0;x<W;x++){
        const i=x+y*W;
        let e = PLATES[T.plate[i]].base;
        const st=T.stress[i];
        if(st>0) e += st*0.92*(0.45+0.85*ridge(x,y,seed^0x1234,5,4.2));
        else     e += st*0.42;
        e += (fbm(x,y,seed^0xabc,5,1.7)-0.5)*0.30;
        e += (fbm(x,y,seed^0xdef,4,6.0)-0.5)*0.055;
        T.elev[i]=e+hs[i]+polar;
      }
    }
    /* smooth once to kill single-tile spikes */
    const tmp=new Float32Array(NT);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const i=x+y*W; let s=T.elev[i]*2,w=2;
      for(let d=0;d<8;d++){ const ny=y+N8Y[d]; if(ny<0||ny>=H)continue;
        s+=T.elev[wrapx(x+N8X[d])+ny*W]; w++; }
      tmp[i]=s/w;
    }
    T.elev.set(tmp);
  }

  /* ---- 4. sea level ----------------------------------------------------- */
  yield [0.16,'the waters find their level'];
  {
    const BINS=2048, hist=new Int32Array(BINS);
    let mn=1e9,mx=-1e9;
    for(let i=0;i<NT;i++){ const e=T.elev[i]; if(e<mn)mn=e; if(e>mx)mx=e; }
    const span=Math.max(1e-6,mx-mn);
    for(let i=0;i<NT;i++) hist[clamp(((T.elev[i]-mn)/span*(BINS-1))|0,0,BINS-1)]++;
    let want=Math.round(NT*(1-SEA_TARGET)), acc=0, b=0;
    for(;b<BINS;b++){ acc+=hist[b]; if(acc>=want) break; }
    SEA = mn + (b/(BINS-1))*span;
    const top=mx-SEA||1, bot=SEA-mn||1;
    for(let i=0;i<NT;i++){
      const e=T.elev[i];
      T.land[i]= e>SEA?1:0;
      T.alt[i] = e>SEA? (e-SEA)/top : -(SEA-e)/bot;
    }
  }

  /* ---- 5. the old power settles into the rock --------------------------- */
  yield [0.19,'the world hums with an older power'];
  leylines(seed);

  /* ---- 6. the Elder Age breaks the world -------------------------------- */
  yield [0.23,'before the counting of years, the world was broken'];
  elderShape(seed);

  /* ---- 7. shores, then climate ------------------------------------------ */
  yield [0.28,'shores are drawn; winds rise'];
  distanceFromSea();
  climate(seed);

  /* ---- 8. erosion & hydrology ------------------------------------------- */
  yield [0.34,'rain carves the highlands'];
  for(let pass=0;pass<2;pass++){
    priorityFlood();
    flowRouting();
    /* stream-power erosion */
    for(let i=0;i<NT;i++){
      if(!T.land[i]) continue;
      const a=T.acc[i], s=T.slope[i];
      const e=Math.min(0.055, 0.00055*Math.pow(a,0.42)*Math.pow(s+0.02,0.9));
      T.elev[i]-=e;
    }
    /* isostatic-ish smoothing of the eroded field */
    const tmp=new Float32Array(NT);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const i=x+y*W; let s=T.elev[i]*3,w=3;
      for(let d=0;d<8;d+=2){ const ny=y+N8Y[d]; if(ny<0||ny>=H)continue;
        s+=T.elev[wrapx(x+N8X[d])+ny*W]; w++; }
      tmp[i]=s/w;
    }
    for(let i=0;i<NT;i++) if(T.land[i]) T.elev[i]=tmp[i];
    for(let i=0;i<NT;i++){
      const e=T.elev[i];
      T.land[i]= e>SEA?1:0;
      T.alt[i] = e>SEA? Math.max(0,(e-SEA))/(1-SEA) : -(SEA-e)/(SEA||1);
    }
    yield [0.34+0.04*(pass+1),'rivers seek the sea ('+(pass+1)+')'];
  }
  levelSea();
  distanceFromSea();
  climate(seed);
  priorityFlood();
  flowRouting();
  rivers();

  /* ---- 9. biomes & soils ------------------------------------------------ */
  yield [0.46,'green things take root'];
  biomes(seed);
  soils(seed);

  /* ---- 10. ores & riches ------------------------------------------------- */
  yield [0.52,'ore settles in the deep places'];
  resources(seed);
  /* the scars and the fire-mountains hold power the plain rock does not */
  for(let i=0;i<NT;i++){
    if(T.scar[i]) T.ley[i]=clamp(T.ley[i]+0.35,0,2.2);
    if(T.biome[i]===B_VOLCANIC) T.ley[i]=clamp(T.ley[i]+0.30,0,2.2);
  }

  /* ---- 11. travel, harbours, chokepoints -------------------------------- */
  yield [0.58,'roads that are not yet roads'];
  travelCosts();
  harbours();
  chokepoints();
}

/* ------------------------------------------------------------- sub-passes  */
/* Choose the waterline that gives the land fraction we asked for. */
function levelSea(){
  const BINS=2048, hist=new Int32Array(BINS);
  let mn=1e9,mx=-1e9;
  for(let i=0;i<NT;i++){ const e=T.elev[i]; if(e<mn)mn=e; if(e>mx)mx=e; }
  const span=Math.max(1e-6,mx-mn);
  for(let i=0;i<NT;i++) hist[clamp(((T.elev[i]-mn)/span*(BINS-1))|0,0,BINS-1)]++;
  const want=Math.round(NT*(1-SEA_TARGET));
  let acc=0,b=0;
  for(;b<BINS;b++){ acc+=hist[b]; if(acc>=want) break; }
  SEA = mn + (b/(BINS-1))*span;
  const top=Math.max(1e-6,mx-SEA), bot=Math.max(1e-6,SEA-mn);
  for(let i=0;i<NT;i++){
    const e=T.elev[i];
    T.land[i]= e>SEA?1:0;
    T.alt[i] = e>SEA? (e-SEA)/top : -(SEA-e)/bot;
  }
}
function distanceFromSea(){
  T.distSea.fill(0);
  const q=new Int32Array(NT); let qh=0,qt=0;
  const seen=new Uint8Array(NT);
  for(let i=0;i<NT;i++) if(!T.land[i]){ q[qt++]=i; seen[i]=1; T.distSea[i]=0; }
  while(qh<qt){
    const i=q[qh++]; const d=T.distSea[i];
    const x=i%W,y=(i/W)|0;
    for(let k=0;k<8;k++){
      const ny=y+N8Y[k]; if(ny<0||ny>=H) continue;
      const j=wrapx(x+N8X[k])+ny*W;
      if(seen[j]) continue; seen[j]=1;
      T.distSea[j]=Math.min(32000,d+1); q[qt++]=j;
    }
  }
  for(let i=0;i<NT;i++){
    T.coast[i]=0;
    if(T.land[i]&&T.distSea[i]===1) T.coast[i]=1;
  }
  /* and the mirror field: how far out to sea are we? this is what lets the
     map draw a shelf, a sea and an abyss instead of one flat blue. */
  T.distLand.fill(0);
  const q2=new Int32Array(NT); let h2=0,t2=0;
  const seen2=new Uint8Array(NT);
  for(let i=0;i<NT;i++) if(T.land[i]){ q2[t2++]=i; seen2[i]=1; }
  while(h2<t2){
    const i=q2[h2++]; const d=T.distLand[i];
    const x=i%W,y=(i/W)|0;
    for(let k=0;k<8;k++){
      const ny=y+N8Y[k]; if(ny<0||ny>=H) continue;
      const j=wrapx(x+N8X[k])+ny*W;
      if(seen2[j]) continue; seen2[j]=1;
      T.distLand[j]=Math.min(400,d+1); q2[t2++]=j;
    }
  }
}

function climate(seed){
  /* winds by circulation cell, blended */
  for(let y=0;y<H;y++){
    const l=latOf(y), al=Math.abs(l), sgn=l>=0?1:-1;
    let u,v;
    const t1=smooth(clamp((al-0.28)/0.10,0,1));      // trades -> westerlies
    const t2=smooth(clamp((al-0.62)/0.10,0,1));      // westerlies -> polar
    const trU=-0.95, wsU=0.95, poU=-0.75;
    u = lerp(lerp(trU,wsU,t1), poU, t2);
    const trV=-0.32*sgn, wsV=0.22*sgn, poV=-0.18*sgn;
    v = lerp(lerp(trV,wsV,t1), poV, t2);
    for(let x=0;x<W;x++){
      const i=x+y*W;
      const n=(fbm(x,y,seed^0x77a1,3,3.0)-0.5)*0.32;
      let uu=u+n, vv=v+n*0.5;
      const m=Math.hypot(uu,vv)||1;
      T.windU[i]=uu/m; T.windV[i]=vv/m;
    }
  }
  /* temperature */
  for(let y=0;y<H;y++){
    const al=Math.abs(latOf(y));
    const base = 31 - 57*Math.pow(al,1.55);
    for(let x=0;x<W;x++){
      const i=x+y*W;
      const cont=clamp(T.distSea[i]/14,0,1);
      const km = T.land[i]? T.alt[i]*5.4 : 0;
      let t = base - km*6.3 + (fbm(x,y,seed^0x2b7,4,5.0)-0.5)*3.2;
      t += cont*(al<0.30? 1.4 : -1.8);
      T.temp[i]=t;
      T.tvar[i]= 3 + 26*Math.pow(al,1.3)*(0.35+0.65*cont);
    }
  }
  /* rainfall: latitudinal circulation + upwind moisture advection + orography */
  const K=42;
  for(let y=0;y<H;y++){
    const al=Math.abs(latOf(y));
    const itcz=Math.exp(-sq((al-0.015)/0.145));
    const mid =Math.exp(-sq((al-0.585)/0.170));
    const sub =Math.exp(-sq((al-0.320)/0.115));
    const pol =Math.exp(-sq((al-1.000)/0.180));
    let base = 2500*itcz + 1150*mid - 780*sub - 300*pol + 430;
    if(base<50) base=50;
    for(let x=0;x<W;x++){
      const i=x+y*W;
      if(!T.land[i]){ T.rain[i]=base*1.15; continue; }
      /* march upwind gathering moisture */
      let px=x+0.5, py=y+0.5, m=0, carry=1, prevE=T.elev[i];
      for(let k=0;k<K;k++){
        const ii=wrapx(Math.floor(px))+clamp(Math.floor(py),0,H-1)*W;
        px-=T.windU[ii]; py-=T.windV[ii];
        if(py<0||py>=H) break;
        const j=wrapx(Math.floor(px))+(Math.floor(py)|0)*W;
        const rise=Math.max(0,prevE-T.elev[j]);   // ground climbs going downwind
        carry*=Math.exp(-rise*7.4);
        if(!T.land[j]){
          m += carry*(0.55+0.030*clamp(T.temp[j],-5,30))*Math.exp(-k/26);
        }else{
          carry*=0.9825;
          m += carry*0.055*BIOMEWET(T,j)*Math.exp(-k/26);
        }
        prevE=T.elev[j];
        if(carry<0.02) break;
      }
      const adv=clamp(m/9,0,1.8);
      /* local orographic lift */
      const uw = wrapx(Math.round(x-T.windU[i]*2))+clamp(Math.round(y-T.windV[i]*2),0,H-1)*W;
      const lift=Math.max(0,T.elev[i]-T.elev[uw]);
      let rr = base*(0.30+0.86*adv) * (1 + 4.2*lift);
      rr *= (0.80+0.40*fbm(x,y,seed^0x9911,4,6.0));
      T.rain[i]=clamp(rr,15,5200);
    }
  }
}
/* transpiration proxy for the moisture march (avoids a forward reference) */
function BIOMEWET(T,j){ return T.rain[j]>0? clamp(T.rain[j]/1400,0.05,1) : 0.35; }

/* Priority-flood depression filling (Barnes 2014). */
function priorityFlood(){
  const heap=new MinHeap(NT);
  const done=new Uint8Array(NT);
  for(let i=0;i<NT;i++) T.fill[i]=T.elev[i];
  for(let i=0;i<NT;i++){
    if(!T.land[i]){ done[i]=1; heap.push(T.elev[i],i); }
  }
  for(let x=0;x<W;x++){
    for(const y of [0,H-1]){ const i=x+y*W; if(!done[i]){ done[i]=1; heap.push(T.elev[i],i); } }
  }
  const EPS=2e-5;
  while(heap.size){
    const i=heap.pop(); const ei=T.fill[i];
    const x=i%W,y=(i/W)|0;
    for(let d=0;d<8;d++){
      const ny=y+N8Y[d]; if(ny<0||ny>=H) continue;
      const j=wrapx(x+N8X[d])+ny*W;
      if(done[j]) continue; done[j]=1;
      if(T.fill[j]<=ei) T.fill[j]=ei+EPS;
      heap.push(T.fill[j],j);
    }
  }
}

let ORDER=null;
function flowRouting(){
  /* steepest descent on the filled surface */
  for(let i=0;i<NT;i++){
    if(!T.land[i]){ T.fdir[i]=-1; T.slope[i]=0; continue; }
    const x=i%W,y=(i/W)|0, e=T.fill[i];
    let bd=-1,bs=0;
    for(let d=0;d<8;d++){
      const ny=y+N8Y[d]; if(ny<0||ny>=H) continue;
      const j=wrapx(x+N8X[d])+ny*W;
      const s=(e-T.fill[j])/N8D[d];
      if(s>bs){bs=s;bd=d;}
    }
    T.fdir[i]=bd; T.slope[i]=clamp(bs*11,0,1);
  }
  /* accumulate in descending filled-elevation order */
  if(!ORDER||ORDER.length!==NT) ORDER=new Int32Array(NT);
  for(let i=0;i<NT;i++) ORDER[i]=i;
  const f=T.fill;
  const arr=Array.from(ORDER);
  arr.sort((a,b)=>f[b]-f[a]);
  for(let i=0;i<NT;i++) ORDER[i]=arr[i];
  for(let i=0;i<NT;i++) T.acc[i]= T.land[i]? (0.35+T.rain[i]/1100) : 0;
  for(let k=0;k<NT;k++){
    const i=ORDER[k]; const d=T.fdir[i];
    if(d<0) continue;
    const x=i%W,y=(i/W)|0, ny=y+N8Y[d];
    if(ny<0||ny>=H) continue;
    const j=wrapx(x+N8X[d])+ny*W;
    T.acc[j]+=T.acc[i];
  }
}

function rivers(){
  T.lake.fill(0);
  /* A river is a river relative to the world it is in: take the wettest 4%
     of land, so small continents still get drawn a river network. */
  const samp=[];
  for(let i=0;i<NT;i+=3) if(T.land[i]) samp.push(T.acc[i]);
  samp.sort((a,b)=>a-b);
  RIVMIN = samp.length? clamp(samp[Math.floor(samp.length*0.960)],4,60) : 26;
  RIVBIG = RIVMIN*4.5; RIVNAV = RIVMIN*13;
  for(let i=0;i<NT;i++){
    T.flow[i]=0;
    if(!T.land[i]) continue;
    if(T.fill[i]-T.elev[i] > 0.0055 && T.acc[i]>RIVMIN*0.35) T.lake[i]=1;
    if(T.acc[i]>RIVMIN) T.flow[i]=T.acc[i];
  }
  /* lakes become water tiles for climate/biome purposes */
  for(let i=0;i<NT;i++) if(T.lake[i]) T.biome[i]=B_LAKE;
}

function biomes(seed){
  for(let i=0;i<NT;i++){
    if(!T.land[i]){
      const a=T.alt[i];
      if(T.temp[i]<-9 && T.distSea[i]===0 && Math.abs(latOf((i/W)|0))>0.80) { T.biome[i]=B_ICECAP; continue; }
      T.biome[i] = a>-0.10? B_SHELF : (a>-0.45? B_OCEAN : B_DEEP);
      continue;
    }
    if(T.lake[i]){ T.biome[i]=B_LAKE; continue; }
    const t=T.temp[i], p=T.rain[i], al=T.alt[i], sl=T.slope[i];
    let b;
    if(al>0.68 && t<-4) b=B_GLACIER;
    else if(al>0.62) b= t<2? B_BARREN : (p>700? B_ALPINE : B_BARREN);
    else if(al>0.46) b= t<-2? B_GLACIER : (p>560? B_ALPINE : (t>19&&p<260? B_BADLAND : B_BARREN));
    else if(t<-11) b=B_ICECAP;
    else if(t<-4)  b= p>240? B_TUNDRA : B_COLDDESERT;
    else if(t<2.5) b= p>460? (p>900&&sl<0.12? B_BOG : B_TAIGA) : (p>190? B_TUNDRA : B_COLDDESERT);
    else if(t<9)   b= p>950? B_TAIGA : (p>430? B_TFOREST : (p>210? B_STEPPE : B_COLDDESERT));
    else if(t<17){
      if(p>1500) b=B_TRAINFOREST; else if(p>800) b=B_TFOREST;
      else if(p>470) b=B_PRAIRIE; else if(p>250) b=B_STEPPE; else b=B_DESERT;
    } else if(t<23){
      if(p>1700) b=B_TRAINFOREST; else if(p>1000) b=B_TFOREST;
      else if(p>620) b=B_PRAIRIE; else if(p>340) b=B_SHRUB;
      else if(p>170) b=B_STEPPE; else b=B_DESERT;
    } else {
      if(p>2100) b=B_JUNGLE; else if(p>1250) b=B_MONSOON;
      else if(p>620) b=B_SAVANNA; else if(p>300) b=B_SHRUB; else b=B_DESERT;
    }
    /* wetlands where water pools on flat ground */
    if(sl<0.05 && T.acc[i]>120 && al<0.30 && b!==B_DESERT)
      b = t>21? (T.coast[i]? B_MANGROVE : B_MARSH) : (t<1? B_BOG : B_MARSH);
    /* endorheic salt flats: big flow that never reaches the sea */
    if(b===B_DESERT && T.fill[i]-T.elev[i]>0.004 && T.acc[i]>40) b=B_SALT;
    T.biome[i]=b;
  }
  /* volcanic waste near hot plumes */
  for(const hp of HOTSPOTS){
    for(let s=0;s<hp.len;s+=3){
      const hx=hp.x+hp.dx*s*1.6, hy=hp.y+hp.dy*s*1.6;
      if(hy<1||hy>=H-1) continue;
      const i=wrapx(Math.round(hx))+Math.round(hy)*W;
      if(T.land[i]&&T.alt[i]>0.30){ T.biome[i]=B_VOLCANIC;
        nb8(i,j=>{ if(T.land[j]&&T.alt[j]>0.34&&h2(j,7,3)%5===0) T.biome[j]=B_VOLCANIC; }); }
    }
  }
}

function soils(seed){
  for(let i=0;i<NT;i++){
    if(!T.land[i]){ T.fert[i]=0; continue; }
    const b=BIOME[T.biome[i]];
    let f=b.food;
    /* floodplain / delta bonus */
    if(T.acc[i]>60) f+=0.30*clamp(Math.log(T.acc[i])/8,0,1);
    let riverAdj=0; nb4(i,j=>{ if(T.flow[j]>0) riverAdj=1; });
    if(riverAdj) f+=0.13;
    if(T.biome[i]===B_VOLCANIC) f=0.10;
    let volc=0; nb8(i,j=>{ if(T.biome[j]===B_VOLCANIC) volc=1; });
    if(volc) f+=0.26;
    f *= (1-0.62*T.slope[i]);
    f *= (0.86+0.28*fbm(i%W,(i/W)|0,seed^0x33aa,3,9.0));
    /* growing season */
    const gs = clamp((T.temp[i]+4)/16,0,1.15);
    f *= (0.30+0.80*gs);
    T.fert[i]=clamp(f,0,1.25);
  }
}

function resources(seed){
  const r=stream(seed,'ores');
  const oro=new Float32Array(NT);
  for(let i=0;i<NT;i++) oro[i]=Math.max(0,T.stress[i]);
  for(let i=0;i<NT;i++){
    T.res[i]=R_NONE; T.resq[i]=0;
    const x=i%W,y=(i/W)|0, b=T.biome[i], al=T.alt[i];
    const n1=fbm(x,y,seed^0x1a1,3,16.0), n2=fbm(x,y,seed^0x2b2,3,22.0), n3=fbm(x,y,seed^0x3c3,3,11.0);
    if(!T.land[i]){
      if(b===B_SHELF && n1>0.72){ T.res[i]=R_FISH; T.resq[i]=0.6+n1*0.8; }
      else if(b===B_OCEAN && n2>0.86){ T.res[i]=R_WHALE; T.resq[i]=0.7+n2*0.5; }
      else if(b===B_SHELF && T.temp[i]>22 && n3>0.84){ T.res[i]=R_PEARL; T.resq[i]=0.6+n3*0.6; }
      continue;
    }
    const metallic = oro[i]*2.4 + al*0.9;
    let best=R_NONE, q=0;
    const put=(id,v)=>{ if(v>q){q=v;best=id;} };
    if(metallic>0.55){
      put(R_IRON,   (n1-0.50)*2.6*metallic);
      put(R_COPPER, (n2-0.55)*2.4*metallic);
      put(R_TIN,    (n3-0.66)*2.9*metallic);
      put(R_SILVER, (n1*n2-0.34)*3.0*metallic);
      put(R_GOLD,   (n2*n3-0.40)*3.6*metallic);
      put(R_GEMS,   (n1*n3-0.44)*3.8*metallic);
    }
    if(al>0.34) put(R_STONE,(n2-0.42)*1.5);
    if(al>0.40 && n1*n3>0.34) put(R_MARBLE,(n1*n3-0.34)*2.0);
    if(b===B_TFOREST||b===B_TAIGA||b===B_TRAINFOREST||b===B_JUNGLE||b===B_MONSOON)
      put(R_TIMBER,(n3-0.40)*1.9*BIOME[b].wood);
    if(b===B_TAIGA||b===B_TUNDRA||b===B_BOG) put(R_FURS,(n1-0.46)*2.1);
    if(b===B_STEPPE||b===B_PRAIRIE) put(R_HORSES,(n2-0.50)*2.6);
    if(b===B_SALT) put(R_SALT,1.1);
    if(T.coast[i] && T.rain[i]<520 && T.temp[i]>16) put(R_SALT,(n1-0.44)*2.2);
    if((b===B_MARSH||b===B_BOG) && T.temp[i]>2) put(R_COAL,(n2-0.60)*2.6);
    if(b===B_TFOREST && T.distSea[i]<9 && T.temp[i]<12) put(R_AMBER,(n3-0.70)*2.6);
    if(b===B_VOLCANIC) put(R_OBSIDIAN,0.9+n1*0.4);
    if(b===B_VOLCANIC||(al>0.5&&n2>0.80)) put(R_SULFUR,(n2-0.66)*2.2);
    if(b===B_JUNGLE||b===B_MONSOON) put(R_SPICE,(n1-0.56)*2.5);
    if((b===B_MONSOON||b===B_TFOREST)&&T.temp[i]>15) put(R_SILK,(n3-0.66)*2.5);
    if(b===B_SHRUB||(b===B_TFOREST&&T.temp[i]>13&&T.rain[i]<900))
      put(R_VINES,(n2-0.52)*2.3);
    if(q>0.05){ T.res[i]=best; T.resq[i]=clamp(q,0.1,1.6); }
  }
  /* starmetal: rare, always dramatic — a handful of meteor falls */
  const nfall=ri(r,2,5);
  for(let k=0;k<nfall;k++){
    for(let a=0;a<400;a++){
      const i=ri(r,0,NT-1);
      if(T.land[i]&&T.alt[i]>0.12){ T.res[i]=R_STARMETAL; T.resq[i]=rf(r,0.9,1.6); break; }
    }
  }
}

function leylines(seed){
  /* Power pools where the crust is torn and where the world's old wounds lie. */
  for(let i=0;i<NT;i++){
    const x=i%W,y=(i/W)|0;
    const t=Math.abs(T.stress[i]);
    const n=fbm(x,y,seed^0x7e11,5,3.4);
    const nn=ridge(x,y,seed^0x4d21,4,5.0);
    let v = 0.34*t*2.2 + 0.42*Math.pow(nn,2.1) + 0.24*n;
    if(T.biome[i]===B_VOLCANIC) v+=0.30;
    if(T.lake[i]) v+=0.06;
    T.ley[i]=clamp(v,0,1.6);
  }
}

function travelCosts(){
  for(let i=0;i<NT;i++){
    const b=BIOME[T.biome[i]];
    if(!T.land[i]){
      T.cost[i]=999;
      let c = 1.0 + Math.max(0,-T.alt[i])*2.6;      // open ocean is dangerous
      if(T.biome[i]===B_SHELF) c=0.68;
      if(T.biome[i]===B_ICECAP) c=6.0;
      T.scost[i]=c;
    }else{
      let c=b.cost + T.slope[i]*4.2 + Math.max(0,T.alt[i]-0.3)*3.0;
      if(T.flow[i]>RIVBIG) c+=2.2;                      // major river crossing
      T.cost[i]=c;
      T.scost[i]= T.flow[i]>RIVNAV? 1.3 : 999;          // great rivers are navigable
    }
  }
}

function harbours(){
  for(let i=0;i<NT;i++){
    T.harbor[i]=0;
    if(!T.land[i]||!T.coast[i]) continue;
    let water=0, shelter=0, deep=0;
    nb8(i,j=>{ if(!T.land[j]){ water++; if(T.biome[j]===B_SHELF) shelter++; } else shelter+=0.5; });
    const x=i%W,y=(i/W)|0;
    for(let d=0;d<8;d++){
      const ny=y+N8Y[d]*3; if(ny<0||ny>=H) continue;
      const j=wrapx(x+N8X[d]*3)+ny*W;
      if(!T.land[j]&&T.alt[j]<-0.10) deep++;
    }
    if(water<1) continue;
    let h = (Math.min(water,4)/4)*0.42 + (shelter/8)*0.36 + Math.min(deep,3)/3*0.22;
    if(T.flow[i]>RIVBIG) h+=0.30;                        // river mouth
    if(T.lake[i]) h*=0.4;
    const ice = T.temp[i]<-6? 0.35 : 1;
    T.harbor[i]=clamp(h*ice,0,1.4);
  }
}

function chokepoints(){
  /* A pass is cheap ground flanked by expensive ground on opposite sides. */
  for(let i=0;i<NT;i++){
    T.pass[i]=0; T.defen[i]=0;
    if(!T.land[i]) continue;
    const x=i%W,y=(i/W)|0;
    const c=[];
    for(let d=0;d<8;d++){
      const ny=y+N8Y[d]; if(ny<0||ny>=H){ c.push(99); continue; }
      c.push(T.cost[wrapx(x+N8X[d])+ny*W]);
    }
    let def = T.slope[i]*0.55 + Math.max(0,T.alt[i]-0.18)*0.9;
    let water=0; nb4(i,j=>{ if(!T.land[j]||T.flow[j]>RIVBIG||T.lake[j]) water++; });
    def += water*0.12;
    T.defen[i]=clamp(def,0,1);
    const me=T.cost[i];
    if(me>2.6) continue;
    for(let d=0;d<4;d++){
      const a=c[d], b=c[(d+4)%8], p=c[(d+2)%8], q=c[(d+6)%8];
      if(a>3.6&&b>3.6&&p<2.4&&q<2.4){ T.pass[i]=1; T.defen[i]=clamp(def+0.35,0,1); break; }
    }
  }
}

/* --------------------------------------------------------------- phonology  */
function makePhonology(r){
  const cons=C_CORE.slice();
  for(const c of C_COMMON) if(chance(r,0.62)) cons.push(c);
  for(const c of C_RARE)   if(chance(r,0.24)) cons.push(c);
  const vows=V_CORE.slice();
  for(const v of V_COMMON) if(chance(r,0.66)) vows.push(v);
  for(const v of V_RARE)   if(chance(r,0.26)) vows.push(v);
  const onsets=cons.slice();
  const codaPool=cons.filter(c=>['p','t','k','m','n','s','l','r','N','T','S','f','x','z','d','g','b'].indexOf(c)>=0);
  const codas = codaPool.length? sampleK(r,codaPool,Math.max(2,(codaPool.length*rf(r,0.35,0.9))|0)) : ['n'];
  const clusterOK = chance(r,0.5);
  const clusters=[];
  if(clusterOK){
    const liq=cons.filter(c=>'lrwy'.indexOf(c)>=0);
    const stop=cons.filter(c=>'ptkbdgfsSx'.indexOf(c)>=0);
    for(const s of stop) for(const l of liq) if(chance(r,0.42)) clusters.push(s+l);
  }
  const tmplPool=[];
  const add=(t,n)=>{ for(let i=0;i<n;i++) tmplPool.push(t); };
  add('CV', ri(r,5,9)); add('CVC', ri(r,2,7)); add('V', ri(r,0,2)); add('VC', ri(r,0,3));
  if(clusters.length){ add('LV', ri(r,0,3)); add('LVC', ri(r,0,2)); }
  if(codas.length) add('CVC', 2);
  return {cons,vows,onsets,codas,clusters,tmplPool,
          maxSyl: ri(r,2,3), minSyl: 1,
          romStyle: ri(r,0,2),
          harmony: chance(r,0.22),
          stress: pick(r,['initial','penult','final'])};
}

function genWord(ph,r,minS,maxS){
  const n=ri(r,minS!==undefined?minS:ph.minSyl, maxS!==undefined?maxS:ph.maxSyl);
  const out=[];
  let frontHarm = chance(r,0.5);
  for(let s=0;s<n;s++){
    let t=pick(r,ph.tmplPool);
    if(s===0&&t[0]==='V'&&chance(r,0.5)) t='C'+t;
    for(const ch of t){
      if(ch==='C') out.push(pick(r,ph.onsets));
      else if(ch==='L') out.push.apply(out, ph.clusters.length? pick(r,ph.clusters).split('') : [pick(r,ph.onsets)]);
      else if(ch==='V'){
        let v=pick(r,ph.vows);
        if(ph.harmony){
          const front='ieEIäü3'.indexOf(v)>=0;
          if(s>0 && front!==frontHarm){
            const alt=ph.vows.filter(q=>('ieEIäü3'.indexOf(q)>=0)===frontHarm);
            if(alt.length) v=pick(r,alt);
          } else if(s===0) frontHarm=('ieEIäü3'.indexOf(v)>=0);
        }
        out.push(v);
      }
    }
  }
  return out;
}

/* --------------------------------------------------------- sound-change law */
const LAWS=[
  {n:'Grimm’s shift',        f:(w)=>map(w,{p:'f',t:'T',k:'x',b:'p',d:'t',g:'k'})},
  {n:'lenition',             f:(w)=>inter(w,{p:'b',t:'d',k:'g',s:'h',f:'v'})},
  {n:'final devoicing',      f:(w)=>final(w,{b:'p',d:'t',g:'k',z:'s',v:'f'})},
  {n:'rhotacism',            f:(w)=>inter(w,{z:'r',s:'r'})},
  {n:'palatalisation',       f:(w)=>beforeFront(w,{k:'C',g:'J',t:'c',s:'S'})},
  {n:'apocope',              f:(w)=>apocope(w)},
  {n:'syncope',              f:(w)=>syncope(w)},
  {n:'the great vowel shift',f:(w)=>map(w,{a:'e',e:'i',i:'1',o:'u',u:'2',A:'E',E:'I',O:'U'})},
  {n:'vowel lowering',       f:(w)=>map(w,{i:'e',u:'o',I:'E',U:'O',e:'a',E:'A'})},
  {n:'vowel breaking',       f:(w)=>map(w,{A:'2',E:'3',I:'5',O:'4',U:'6'})},
  {n:'nasal loss',           f:(w)=>nasalLoss(w)},
  {n:'debuccalisation',      f:(w)=>initial(w,{s:'h',f:'h',T:'h',x:'h'})},
  {n:'cluster simplification',f:(w)=>declust(w)},
  {n:'prothesis',            f:(w)=>prothesis(w)},
  {n:'liquid merger',        f:(w)=>map(w,{L:'l',R:'r',l:'r'})},
  {n:'spirantisation',       f:(w)=>map(w,{T:'s',D:'z',x:'h',G:'g'})},
  {n:'affrication',          f:(w)=>map(w,{t:'c',d:'J',k:'C'})},
  {n:'w-loss',               f:(w)=>drop(w,['w','ʔ','h'])},
  {n:'glottal hardening',    f:(w)=>map(w,{h:'x',ʔ:'k'})},
  {n:'vowel raising',        f:(w)=>map(w,{a:'o',o:'u',e:'i'})},
  {n:'gemination',           f:(w)=>map(w,{l:'L',r:'R'})},
  {n:'labialisation',        f:(w)=>map(w,{k:'K',g:'B'})},

function map(w,m){ return w.map(p=>m[p]||p); }
function inter(w,m){
  return w.map((p,i)=> (i>0&&i<w.length-1&&isV(w[i-1])&&isV(w[i+1])&&m[p])? m[p] : p);
}
function final(w,m){ const o=w.slice(); const i=o.length-1; if(o.length&&m[o[i]]) o[i]=m[o[i]]; return o; }
function initial(w,m){ const o=w.slice(); if(o.length&&m[o[0]]) o[0]=m[o[0]]; return o; }
function beforeFront(w,m){
  return w.map((p,i)=>{ const nx=w[i+1]; return (nx&&'ieEIäü35'.indexOf(nx)>=0&&m[p])? m[p]:p; });
}
function apocope(w){ let o=w.slice(); let vs=0; for(const p of o) if(isV(p)) vs++;
  if(vs>=2&&isV(o[o.length-1])) o.pop(); return o; }
function syncope(w){
  let vs=0; for(const p of w) if(isV(p)) vs++;
  if(vs<3) return w;
  const o=[]; let seen=0;
  for(let i=0;i<w.length;i++){
    if(isV(w[i])){ seen++;
      if(seen===2 && i>0 && i<w.length-1 && !isV(w[i-1]) && !isV(w[i+1])) continue; }

}
function nasalLoss(w){
  const o=[];
  for(let i=0;i<w.length;i++){
    if((w[i]==='n'||w[i]==='m'||w[i]==='N') && i>0 && isV(w[i-1]) && i<w.length-1 && !isV(w[i+1])){
      const L={a:'A',e:'E',i:'I',o:'O',u:'U'};
      if(L[o[o.length-1]]) o[o.length-1]=L[o[o.length-1]];
      continue;
    }
    o.push(w[i]);
  }
  return o;
}
function declust(w){
  const o=[];
  for(let i=0;i<w.length;i++){
    if(i<w.length-1 && !isV(w[i]) && !isV(w[i+1]) && (i===0||isV(w[i-1]))) continue;

/* ------------------------------------------------------------- romanisation */
function romanize(ph,w){
  let s='';
  for(let i=0;i<w.length;i++){
    const p=w[i];
    const e=CMAP[p]||VMAP[p];
    if(!e){ s+=p; continue; }
    let v=e.r[Math.min(ph.romStyle,e.r.length-1)];
    if(v===''&&s==='') v=e.r[0]||'';
    s+=v;
  }
  s=s.replace(/([bcdfghjklmnpqrstvwxyz])\1\1+/gi,'$1$1');
  s=s.replace(/^-+|-+$/g,'');
  return s;
}
function capWord(s){ return s? s.charAt(0).toUpperCase()+s.slice(1) : s; }

/* --------------------------------------------------------------- Language   */
let LANGS=[];
class Language {
  constructor(id,seed,parent,name){
    this.id=id; this.parent=parent? parent.id : -1;
    this.family = parent? parent.family : id;
    this.depth = parent? parent.depth+1 : 0;
    this.laws = [];
    this.rng = stream(seed,'lang'+id);
    const r=this.rng;
    if(parent){
      this.ph = Object.assign({},parent.ph);
      this.ph.romStyle = chance(r,0.45)? ri(r,0,2) : parent.ph.romStyle;
      const nlaw=ri(r,2,4);
      const used={};
      for(let k=0;k<nlaw;k++){
        const L=pick(r,LAWS); if(used[L.n]) continue; used[L.n]=1; this.laws.push(L);
      }
      this.lex={};
      for(const c of CONCEPTS){
        let w=parent.lex[c]? parent.lex[c].slice() : genWord(this.ph,r);
        for(const L of this.laws) w=L.f(w);
        if(!w.length) w=genWord(this.ph,r);
        this.lex[c]=w;
      }
      /* lexical innovation: a share of roots are simply replaced */
      const innov=rf(r,0.06,0.20);
      for(const c of CONCEPTS) if(chance(r,innov)) this.lex[c]=genWord(this.ph,r);
    }else{
      this.ph=makePhonology(r);
      this.lex={};
      for(const c of CONCEPTS) this.lex[c]=genWord(this.ph,r);
    }
    /* morphology */
    this.aff={
      place: genWord(this.ph,r,1,1),
      folk:  genWord(this.ph,r,1,1),
      gen:   genWord(this.ph,r,1,1),
      son:   genWord(this.ph,r,1,1),
      dau:   genWord(this.ph,r,1,1),
      land:  this.lex.land.slice()
    };
    this.headFirst = chance(r,0.45);
    this.linker = chance(r,0.4)? [pick(r,this.ph.vows)] : [];
    this.name = name || capWord(romanize(this.ph,this.lex.word.concat(this.aff.folk)));
    this.used = Object.create(null);
  }
  w(c){ return this.lex[c] || (this.lex[c]=genWord(this.ph,this.rng)); }
  say(c){ return capWord(romanize(this.ph,this.w(c))); }
  /* compose morphemes into one word; returns {t:text, g:gloss}.
     Compounds clip their elements the way real ones do — nobody says
     "Aethelbeorhtingaham" twice.                                          */
  compose(parts,opts){
    opts=opts||{};
    if(parts.length>2) parts=parts.slice(0,2);
    const seq = this.headFirst? parts.slice() : parts.slice().reverse();
    const budget = seq.length>=2? 2 : 3;
    let w=[];
    for(let i=0;i<seq.length;i++){
      if(i) w=w.concat(this.linker);
      let m=this.w(seq[i]);
      if(seq.length>=2) m=clipSyl(m, i===seq.length-1? budget : budget-1+1);
      w=w.concat(m);
    }
    if(opts.suffix) w=w.concat(clipSyl(this.aff[opts.suffix],1));
    /* no three consonants in a row, and never end on a cluster */
    const out=[]; let run=0;
    for(const p of w){
      if(!isV(p)){ run++; if(run>2) continue; } else run=0;
      out.push(p);
    }
    while(out.length>2 && !isV(out[out.length-1]) && !isV(out[out.length-2])) out.pop();
    let t=capWord(romanize(this.ph,out));
    if(t.length>13){ t=trimTo(t,12); }
    const gl=parts.map(p=>CN[p]||p);
    return {t, g: glossOf(gl,opts.suffix)};
  }
  unique(parts,opts){
    let c=this.compose(parts,opts);
    let n=0;
    const ADJ=['Great','Old','New','High','Low','Far','Little','Black','White','Red','Fair','Upper','Nether','East','West'];
    while(this.used[c.t] && n<8){
      const a=ADJ[n%ADJ.length];
      c={t:a+' '+c.t, g:a.toLowerCase()+' '+c.g};
      if(!this.used[c.t]) break;
      c=this.compose(parts,opts); n++;
    }
    if(this.used[c.t]){ c.t=c.t+' '+roman((n%9)+2); }
    this.used[c.t]=1;
    return c;
  }
}
/* keep the first n syllables of a phoneme sequence */
function clipSyl(w,n){
  let v=0, end=w.length;
  for(let i=0;i<w.length;i++){
    if(isV(w[i])){ v++; if(v>n){ end=i; break; } }
  }
  if(end<w.length){
    /* carry one closing consonant if there is one */
    let e=end;
    while(e<w.length && !isV(w[e]) && e-end<1) e++;
    return w.slice(0,e);
  }
  return w;
}
/* trim a romanised string back to a vowel boundary */
function trimTo(t,n){
  let s=t.slice(0,n);
  const m=s.match(/^(.*[aeiouyáéíóúäöüāēīōū])[^aeiouyáéíóúäöüāēīōū]{0,2}/i);
  return m? m[0] : s;
}
function glossOf(parts,suffix){
  const sfx = suffix==='place'? '-place' : suffix==='folk'? '-folk' : '';
  if(parts.length===1) return parts[0]+sfx;
  const head=parts[parts.length-1], mods=parts.slice(0,-1);
  return mods.join('-')+' '+head+sfx;
}

function langFamilies(seed,nRoots,nLeaves){
  LANGS=[];
  const r=stream(seed,'langtree');
  const roots=[];
  for(let i=0;i<nRoots;i++){ const L=new Language(LANGS.length,seed,null); LANGS.push(L); roots.push(L); }
  /* grow the tree until we have enough leaves */
  let frontier=roots.slice();
  while(LANGS.length<nLeaves){
    const p=pick(r,frontier);
    const kids=ri(r,2,3);
    const nk=[];
    for(let k=0;k<kids && LANGS.length<nLeaves;k++){
      const L=new Language(LANGS.length,seed,p); LANGS.push(L); nk.push(L);
    }
    frontier=frontier.filter(x=>x!==p||chance(r,0.2)).concat(nk);
    if(!frontier.length) frontier=LANGS.slice();
  }
  return LANGS;
}

/* -------------------------------------------------- geography -> toponym    */
/* What does this land look like to the people who name it?                    */
function tileConcepts(i){
  const out=[];
  const b=T.biome[i], al=T.alt[i], t=T.temp[i], p=T.rain[i];
  switch(b){
    case B_TAIGA: out.push('pine'); break;
    case B_TFOREST: out.push(T.temp[i]<10?'birch':'oak'); break;
    case B_TRAINFOREST: out.push('fern'); break;
    case B_JUNGLE: case B_MONSOON: out.push('palm'); break;
    case B_STEPPE: out.push('grass'); break;
    case B_PRAIRIE: out.push('field'); break;
    case B_SHRUB: out.push(T.temp[i]>17?'olive':'thorn'); break;
    case B_DESERT: out.push('sand'); break;
    case B_COLDDESERT: out.push('waste'); break;
    case B_SAVANNA: out.push('grass'); break;
    case B_MARSH: case B_BOG: out.push('reed'); break;
    case B_MANGROVE: out.push('reed'); break;
    case B_TUNDRA: out.push('moss'); break;
    case B_BARREN: case B_ALPINE: out.push('stone'); break;
    case B_GLACIER: out.push('ice'); break;
    case B_VOLCANIC: out.push('ash'); break;
    case B_SALT: out.push('salt'); break;
    case B_BADLAND: out.push('crag'); break;
  }
  if(al>0.55) out.push('peak'); else if(al>0.34) out.push('mount');
  else if(al>0.18) out.push('hill'); else if(al>0.02) out.push('vale');
  if(T.flow[i]>0) out.push('river');
  if(T.lake[i]) out.push('mere');
  if(T.coast[i]) out.push(T.harbor[i]>0.5?'harbor':'shore');
  if(T.pass[i]) out.push('pass');
  /* climate words are a last resort: they are true of half the map */
  if(out.length<2){
    if(t<-2) out.push('cold'); else if(t>25) out.push('warm');
    if(p>2200) out.push('rain'); else if(p<200) out.push('sand');
  }
  if(T.ley[i]>1.0) out.push('spirit');
  if(T.scar[i]) out.push('shadow');
  if(T.defen[i]>0.55) out.push('crag');
  const rr=T.res[i];
  if(rr===R_IRON) out.push('iron'); else if(rr===R_GOLD) out.push('gold_m');
  else if(rr===R_SILVER) out.push('silver_m'); else if(rr===R_SALT) out.push('salt');
  else if(rr===R_GEMS) out.push('gem'); else if(rr===R_TIMBER) out.push('forest');
  else if(rr===R_HORSES) out.push('horse'); else if(rr===R_VINES) out.push('vine');
  else if(rr===R_COPPER) out.push('copper');
  return out;
}
const HEADS_SETTLE=['fort','town','hall','keep','tower','market','house','bridge','gate','harbor','well','mill','city'];
function nameSettlement(lang,i,r,tier){
  const facts=tileConcepts(i);
  const parts=[];
  const nf=Math.min(facts.length, chance(r,0.30)?2:1);
  const chosen=sampleK(r,facts,Math.max(1,nf));
  for(const c of chosen) parts.push(c);
  if(parts.length<2&&chance(r,0.34)) parts.unshift(pick(r,['great','old','new','high','black','white','red','gold','grey','fair','far','holy','little','bright','dark','green']));
  let head=null;
  if(chance(r,0.55)){
    head = T.harbor[i]>0.55? pick(r,['harbor','market','gate','town'])
         : T.defen[i]>0.5?  pick(r,['fort','keep','tower','wall'])
         : pick(r,HEADS_SETTLE);
    parts.push(head);
  }
  const opts = head? {} : {suffix: chance(r,0.5)?'place':null};
  return lang.unique(parts.slice(0,2),opts);
}
function nameRegion(lang,i,r){
  const facts=tileConcepts(i);
  const parts=sampleK(r,facts,Math.min(2,facts.length));
  if(!parts.length) parts.push('land');
  return lang.unique(parts,{suffix:chance(r,0.6)?'place':null});
}
function namePerson(lang,r,fem){
  const a=pick(r,NAME_A);
  if(chance(r,0.62)){
    const b=pick(r,NAME_B);
    const c=lang.compose([a,b]);
    return {t:c.t, g:c.g};
  }
  const c=lang.compose([a]);
  let t=c.t;
  if(fem&&chance(r,0.6)) t = t + romanize(lang.ph,[pick(r,lang.ph.vows)]);
  return {t:capWord(t), g:c.g};
}
function nameDynasty(lang,r,seatName){
  if(seatName&&chance(r,0.45)) return {t:seatName, g:'of '+seatName};
  const a=pick(r,NAME_A), b=pick(r,['house','hall','blood','kin','crown','banner','tower','stone','ring','oath']);
  const c=lang.compose([a,b]);
  return c;
}
/* ============================================================================
   PART IV — PEOPLES, CULTURES AND GODS
   Species are rolled, not chosen. Cultures are value-vectors that drift when
   sundered and converge when joined. Gods are made in the image of the land
   that first feared them.
   ========================================================================== */

let SPECIES=[], CULTURES=[], FAITHS=[];

/* --------------------------------------------------------------- species    */
const TEMPER=['stoic','fierce','merry','sombre','proud','cunning','patient','restless','austere','ardent'];
const SPEC_TAGS=[
 {k:'longlived',   d:'long-lived'}, {k:'shortlived', d:'swift-burning'},
 {k:'delving',     d:'delvers'},    {k:'seafaring',  d:'sea-born'},
 {k:'nomadic',     d:'wandering'},  {k:'arboreal',   d:'wood-dwelling'},
 {k:'hardy',       d:'hardy'},      {k:'frail',      d:'frail'},
 {k:'tall',        d:'tall'},       {k:'small',      d:'small'},
 {k:'fecund',      d:'fecund'},     {k:'barren',     d:'slow to bear'},
 {k:'attuned',     d:'attuned to the old power'}, {k:'deaf',  d:'deaf to magic'},
 {k:'fierce',      d:'warlike'},    {k:'gentle',     d:'peaceable'},
 {k:'clever',      d:'quick to learn'}, {k:'stubborn', d:'slow to change'}
];

function genSpecies(seed){
  SPECIES=[];
  const r=stream(seed,'species');
  const n=ri(r,5,7);
  const elders=ri(r,1,2);
  for(let k=0;k<n;k++){
    const isElder = k<elders;
    const lang=LANGS[k % LANGS.length];
    const magic = isElder? rf(r,0.55,1.0) : rf(r,0.0,0.35);
    const life  = isElder? ri(r,260,1400) : ri(r,42,86);
    const tags=[];
    const pool=SPEC_TAGS.slice();
    for(let q=0;q<ri(r,2,4);q++){ const t=pick(r,pool); if(tags.indexOf(t)<0) tags.push(t); }
    if(isElder && tags.indexOf(SPEC_TAGS[12])<0) tags.push(SPEC_TAGS[12]);
    const bpref=[];
    const allB=[B_TFOREST,B_TAIGA,B_PRAIRIE,B_STEPPE,B_SHRUB,B_JUNGLE,B_MONSOON,
                B_SAVANNA,B_TUNDRA,B_ALPINE,B_BARREN,B_DESERT,B_MARSH,B_TRAINFOREST];
    for(let q=0;q<ri(r,2,4);q++) bpref.push(pick(r,allB));
    const nm = lang.compose([pick(r,['people','kin','folk','first','star','stone','earth','deep','high','shadow','light','fair','old','iron','sea','wind','fire'])],{suffix:'folk'});
    SPECIES.push({
      id:k, name:nm.t, gloss:nm.g, langSeed:lang.id,
      elder:isElder,
      life, matAge: isElder? Math.round(life*0.11) : ri(r,14,17),
      fert: isElder? rf(r,0.16,0.42) : rf(r,0.80,1.25),
      magic, magicDecay: isElder? rf(r,0.55,0.95) : rf(r,0.0,0.25),
      biomePref:bpref,
      temper: pick(r,TEMPER),
      stature: rf(r,0.55,1.45),
      tech: rf(r,0.7,1.3),
      hardy: rf(r,0.7,1.35),
      war: rf(r,0.65,1.4),
      tags, pop:0, color: hsl(k/n+0.05, 0.55, 0.62)
    });
  }
  return SPECIES;
}

/* --------------------------------------------------------------- cultures   */
const VAL_KEYS=['honor','piety','egal','martial','mercantile','xeno','seafaring','literacy',
                'cruelty','curiosity','tradition','zeal'];
const SUCC=[
  {k:'primogeniture', d:'eldest child inherits all'},
  {k:'ultimogeniture',d:'youngest child inherits all'},
  {k:'partible',      d:'the realm is divided among all sons'},
  {k:'elective',      d:'the great lords choose a successor'},
  {k:'tanistry',      d:'the worthiest of the blood is chosen'},
  {k:'seniority',     d:'the eldest of the dynasty inherits'},
  {k:'appointment',   d:'the ruler names an heir'}
];
const GENDER=[{k:'agnatic',d:'men only'},{k:'agnatic-cognatic',d:'men preferred'},
              {k:'absolute',d:'eldest regardless of sex'},{k:'enatic-cognatic',d:'women preferred'},
              {k:'enatic',d:'women only'}];
const CULT_ETH=['austere','ostentatious','mercantile','martial','contemplative','festive',
                'insular','wandering','legalistic','mystic','pastoral','maritime'];

function newCulture(seed,r,species,lang,homeTile,parent){
  const id=CULTURES.length;
  const vals={};
  for(const k of VAL_KEYS) vals[k]= parent? clamp(parent.vals[k]+gauss(r,0,0.12),0,1) : clamp(gauss(r,0.5,0.19),0.02,0.98);
  if(!parent){
    /* the land shapes the first values */
    if(homeTile>=0){
      if(T.coast[homeTile]) vals.seafaring=clamp(vals.seafaring+0.30,0,1);
      if(T.biome[homeTile]===B_STEPPE||T.biome[homeTile]===B_PRAIRIE) vals.martial=clamp(vals.martial+0.18,0,1);
      if(T.alt[homeTile]>0.35) vals.tradition=clamp(vals.tradition+0.20,0,1);
      if(T.fert[homeTile]>0.6) vals.mercantile=clamp(vals.mercantile+0.10,0,1);
      if(T.temp[homeTile]<0) vals.honor=clamp(vals.honor+0.12,0,1);
    }
    vals.literacy=clamp(vals.literacy*0.4,0,1);
  }
  const nm = parent? lang.unique([pick(r,['new','high','far','old','free','lost','great']),'people'],{suffix:'folk'})
                   : (homeTile>=0? lang.unique(sampleK(r,tileConcepts(homeTile).concat(['people']),2),{suffix:'folk'})
                                 : lang.unique(['people'],{suffix:'folk'}));
  const c={
    id, name:nm.t, gloss:nm.g, lang:lang.id, species:species.id,
    parent: parent? parent.id : -1, born: 0,
    vals, succ: parent? (chance(r,0.75)?parent.succ:pick(r,SUCC).k) : pick(r,SUCC).k,
    gender: parent? (chance(r,0.8)?parent.gender:pick(r,GENDER).k) : pickW(r,GENDER,(g,i)=>[3,5,2,1,0.5][i]).k,
    ethos: parent? (chance(r,0.6)?parent.ethos:pick(r,CULT_ETH)) : pick(r,CULT_ETH),
    faith:-1, home:homeTile, pop:0, tiles:0, prestige:0,
    color: hsl(hashStr('cult'+id+nm.t,seed)/4294967296, 0.48+0.3*((id*7)%3)/3, 0.55),
    techs:new Set(), lit:0, arts:0
  };
  CULTURES.push(c);
  return c;
}

/* Values drift every decade; separation makes them diverge. */
function cultureDrift(c,r,pressure){
  for(const k of VAL_KEYS){
    c.vals[k]=clamp(c.vals[k]+gauss(r,0,0.018)+(pressure&&pressure[k]||0),0.02,0.98);
  }
}

const DOMAINS=[

 {k:'storm',n:'Storm',t:['storm','wind','fire']},
 {k:'harvest',n:'the Harvest',t:['grain','field','earth']},

 {k:'trade',n:'Trade',t:['market','road','gift']},
 {k:'wisdom',n:'Wisdom',t:['word','law','star']},
 {k:'ice',n:'Winter',t:['ice','snow','cold']},
 {k:'mountain',n:'the Mountain',t:['mount','stone','peak']},
 {k:'plague',n:'Pestilence',t:['plague','wound','death']},
 {k:'love',n:'Love',t:['heart','flower','life']},
 {k:'fate',n:'Fate',t:['fate','dream','star']},
 {k:'dark',n:'the Dark',t:['dark','shadow','hidden']},

];
const FAITH_KIND=['pantheon','pantheon','pantheon','dualist','ancestral','animist','monist'];

function domainWeights(i){
  /* how much does this land care about each domain? */
  const w={};
  for(const d of DOMAINS) w[d.k]=0.25;
  if(i>=0){
    if(T.coast[i]) { w.sea+=1.4; w.river+=0.3; }
    if(T.harbor[i]>0.5) w.trade+=0.8;
    if(T.flow[i]>0) w.river+=1.1;
    if(T.fert[i]>0.55) w.harvest+=1.3;
    if(T.fert[i]<0.2) { w.death+=0.5; w.exile+=0.6; }
    if(T.alt[i]>0.34) w.mountain+=1.3;
    if(T.temp[i]<0) { w.ice+=1.3; w.hearth+=0.6; }
    if(T.temp[i]>25) { w.sun+=1.0; w.serpent+=0.4; }
    if(T.rain[i]>2000) { w.storm+=0.9; w.tree+=0.5; }
    if(T.rain[i]<250) { w.sun+=0.9; w.exile+=0.6; }
    const b=T.biome[i];
    if(b===B_TFOREST||b===B_TAIGA||b===B_JUNGLE) { w.tree+=1.1; w.beasts+=0.8; w.hunt+=0.7; }
    if(b===B_STEPPE||b===B_PRAIRIE) { w.sky+=1.0; w.hunt+=0.6; w.war+=0.4; }
    if(b===B_VOLCANIC) { w.forge+=1.5; w.serpent+=0.8; }
    if(b===B_MARSH||b===B_BOG) { w.plague+=0.8; w.dark+=0.5; }
    if(T.res[i]===R_IRON||T.res[i]===R_COPPER) w.forge+=1.0;
    if(T.res[i]===R_GOLD||T.res[i]===R_SILVER) { w.sun+=0.5; w.craft+=0.6; }
    if(T.ley[i]>0.9) { w.fate+=1.2; w.wisdom+=0.7; w.dark+=0.4; }
  }
  return w;
}

function newFaith(seed,r,culture,homeTile,parent,kindOverride){
  const id=FAITHS.length;
  const lang=LANGS[culture.lang];
  const kind = kindOverride || (parent? parent.kind : pick(r,FAITH_KIND));
  const gods=[];
  if(parent){
    for(const g of parent.gods) gods.push(Object.assign({},g));
  }else{
    const wts=domainWeights(homeTile);
    const order=DOMAINS.slice().sort((a,b)=>wts[b.k]-wts[a.k]);
    const ng = kind==='monist'? 1 : kind==='dualist'? 2 : kind==='ancestral'? ri(r,2,4) : ri(r,4,9);
    const picked=[];
    for(let k=0;k<ng;k++){
      const d = k<3? order[k] : pickW(r,DOMAINS,dd=>picked.indexOf(dd)>=0?0:wts[dd.k]);
      if(!d||picked.indexOf(d)>=0){ k--; if(picked.length>=DOMAINS.length) break; continue; }
      picked.push(d);
      const parts=sampleK(r,d.t,Math.min(2,d.t.length));
      const nm=lang.unique(parts,{});
      gods.push({name:nm.t, gloss:nm.g, domain:d.k, dname:d.n,
                 sex: chance(r,0.5)?'f':'m', rank:k===0?2:(k<3?1:0),
                 aspect: pick(r,['stern','merciful','jealous','silent','laughing','veiled','many-eyed','ever-young','ancient','wrathful','sorrowing','wandering'])});
    }
  }
  const head = gods.length? gods[0] : null;
  let nm;
  if(parent){
    nm = lang.unique([pick(r,['new','true','pure','old','hidden','broken','first']),'law'],{});
    nm.t = nm.t;
  } else {
    nm = lang.unique([pick(r,['law','oath','word','song','light','fate','holy'])],{});
  }
  const f={
    id, name: parent? nm.t : (head? 'the '+capWord(head.dname.replace(/^the /,''))+' Way' : nm.t),
    native: nm.t, kind, gods,
    parent: parent? parent.id : -1, born:0,
    origin: homeTile, culture: culture.id,
    prosel: parent? clamp(parent.prosel+gauss(r,0,0.15),0,1) : rf(r,0.05,0.95),
    tolerance: parent? clamp(parent.tolerance+gauss(r,0,0.15),0,1) : rf(r,0.05,0.95),
    militancy: parent? clamp(parent.militancy+gauss(r,0,0.15),0,1) : rf(r,0.05,0.95),
    ascetic: rf(r,0,1),
    organized: kind==='animist'? 0 : (chance(r,0.5)?1:0),
    headChar:-1, holy:[], followers:0, doctrine:[],
    color: hsl(hashStr('faith'+id+nm.t,seed)/4294967296, 0.42, 0.58),
    heresies:0
  };
  /* holy sites at genuinely strange places */
  FAITHS.push(f);
  return f;
}

function faithName(f){ return f.name; }
function faithBlurb(f){
  if(!f.gods.length) return 'a faith without names';
  const g=f.gods.slice(0,3).map(g=>g.name+' of '+g.dname);
  return listify(g);
}

/* Distance between two faiths' doctrine, for schism and tolerance checks. */
function faithGap(a,b){
  if(a===b) return 0;
  if(a.parent===b.id||b.parent===a.id) return 0.35;
  if(a.parent>=0&&a.parent===b.parent) return 0.5;
  let shared=0;
  for(const g of a.gods) if(b.gods.some(h=>h.domain===g.domain)) shared++;
  const den=Math.max(1,Math.max(a.gods.length,b.gods.length));
  return clamp(1-shared/den,0.15,1);
}
function cultureGap(a,b){
  if(a===b) return 0;
  let d=0;
  for(const k of VAL_KEYS) d+=Math.abs(a.vals[k]-b.vals[k]);
  d/=VAL_KEYS.length;
  if(a.species!==b.species) d+=0.28;
  if(LANGS[a.lang].family!==LANGS[b.lang].family) d+=0.22;
  else if(a.lang!==b.lang) d+=0.08;
  return clamp(d,0,1.4);
}

/* --------------------------------------------------------------- technology */
const TECHS=[

const TECHI={}; TECHS.forEach((t,i)=>TECHI[t.k]=i);
const NTECH=TECHS.length;

function techEffect(cult,key){
  let v=0;
  const s=cult.techs;
  for(const k of s){ const t=TECHS[TECHI[k]]; if(t&&t.e[key]) v+=t.e[key]; }
  return v;
}
function canLearn(cult,t){
  for(const p of t.pre) if(!cult.techs.has(p)) return false;
  return true;
}

/* --------------------------------------------------------------- settlement */
let SITES=[];
const CL_PEASANT=0,CL_ARTISAN=1,CL_MERCHANT=2,CL_CLERIC=3,CL_WARRIOR=4,CL_NOBLE=5,CL_THRALL=6;
const NCLASS=7;
const CLASSN=['smallfolk','craftsmen','merchants','clergy','men-at-arms','nobility','thralls'];
const TIERN=['hamlet','village','town','city','great city','metropolis'];

let SITEGRID=null, SGW=0,SGH=0,SGC=10;
function siteGridBuild(){
  SGW=Math.ceil(W/SGC); SGH=Math.ceil(H/SGC);
  SITEGRID=[]; for(let i=0;i<SGW*SGH;i++) SITEGRID.push([]);
  for(const s of SITES) if(s.alive) SITEGRID[((s.tile/W|0)/SGC|0)*SGW + ((s.tile%W)/SGC|0)].push(s.id);
}
function siteGridAdd(s){
  if(!SITEGRID) return;
  SITEGRID[((s.tile/W|0)/SGC|0)*SGW + ((s.tile%W)/SGC|0)].push(s.id);
}
function nearbySites(tile,radius){
  const out=[];
  if(!SITEGRID) return out;
  const cx=(tile%W)/SGC|0, cy=((tile/W|0))/SGC|0, rr=Math.ceil(radius/SGC);
  for(let dy=-rr;dy<=rr;dy++){
    const gy=cy+dy; if(gy<0||gy>=SGH) continue;
    for(let dx=-rr;dx<=rr;dx++){
      let gx=(cx+dx)%SGW; if(gx<0)gx+=SGW;
      const cell=SITEGRID[gy*SGW+gx];
      for(const id of cell){ const s=SITES[id]; if(s.alive&&tdist(s.tile,tile)<=radius) out.push(s); }
    }
  }
  return out;
}

function siteSuitability(i){
  if(!T.land[i]||T.biome[i]===B_GLACIER||T.biome[i]===B_ICECAP) return -1;
  let f=0, wood=0, water=0;
  nb8(i,j=>{ if(T.land[j]){ f+=T.fert[j]; wood+=BIOME[T.biome[j]].wood; } });
  f=(f+T.fert[i]*2)/10;
  if(T.flow[i]>0||T.lake[i]) water=1;
  else nb4(i,j=>{ if(T.flow[j]>0||T.lake[j]) water=Math.max(water,0.8); });
  let s = f*1.55 + water*0.55 + T.harbor[i]*0.85 + wood*0.05
        + (T.res[i]?T.resq[i]*0.45:0) + T.defen[i]*0.30 + (T.pass[i]?0.35:0);
  if(T.coast[i]) s+=0.22;
  s -= Math.max(0,T.alt[i]-0.42)*1.7;
  s -= T.slope[i]*0.55;
  if(T.temp[i]<-8) s-=0.9; else if(T.temp[i]<-2) s-=0.35;
  if(T.rain[i]<130) s-=0.6;
  return s;
}

    links:[], hinter:[], hinterW:[], baseFood:0,

  };
