function judgeEpithet(ch,year){
  if(ch.epi) return;
  const age=ageOf(ch,year);
  const r=stream(year*7919+ch.id,'epi');
  if(ch.conquests>=4) return award(ch,'conqueror');
  if(traitHas(ch,'mad')) return award(ch,'mad');
  if(traitHas(ch,'kinslayer')&&chance(r,0.8)) return award(ch,'kinslayer');
  if(ch.bastard&&chance(r,0.35)) return award(ch,'bastard');
  if(ch.wonBattles>=4) return award(ch,'hammer');
  if(ch.sk.lea>=17&&chance(r,0.6)) return award(ch,'wise');
  if(ch.sk.pie>=17&&chance(r,0.6)) return award(ch,'pious');
  if(traitHas(ch,'cruel')&&ch.kills>1) return award(ch,'cruel');
  if(traitHas(ch,'just')&&ch.sk.ste>=14) return award(ch,'just');
  if(traitHas(ch,'brave')&&ch.battles>=3) return award(ch,'bold');
  if(traitHas(ch,'seer')) return award(ch,'seer');
  if(ch.gold>2400) return award(ch,'golden');
  if(ch.great&&(ch.sk.mar+ch.sk.dip+ch.sk.ste)>48&&ch.conquests>=2) return award(ch,'great');
  if(age>0&&ch.died<0&&age>SPECIES[ch.spec].life*0.92) return award(ch,'old');
}

/* --------------------------------------------------------------- marriage   */
function marryPair(a,b,year,r){
  a.sp=b.id; b.sp=a.id; a.married=1; b.married=1;
  a.spouses.push(b.id); b.spouses.push(a.id);
  opine(a,b,18,'we are wed',year); opine(b,a,18,'we are wed',year);
  const pa=a.titles.length?POLS[a.titles[0]]:null, pb=b.titles.length?POLS[b.titles[0]]:null;
  if(pa&&pb&&pa!==pb){
    setRelation(pa,pb,26,'marriage alliance',year);
    pa.marriages=(pa.marriages||0)+1; pb.marriages=(pb.marriages||0)+1;
  }
}
function birth(mo,fa,year,r,bastard){
  const cult=CULTURES[fa? fa.cult : mo.cult];
  const ch=newChar(r,cult, fa? fa.faith : mo.faith, year, fa, mo);
  ch.bastard=bastard?1:0;
  if(bastard&&chance(r,0.5)) ch.dyn=-1;
  if(mo){ mo.kids.push(ch.id); }
  if(fa){ fa.kids.push(ch.id); }
  ch.site = mo? mo.site : (fa?fa.site:-1);
  ch.court= mo? mo.court: (fa?fa.court:-1);
  return ch;
}
/* ============================================================================
   PART VII — CROWNS, VASSALS AND THE LAW OF SUCCESSION
   A realm is a pyramid of oaths. Every oath has a price, and every heir has
   a rival who can count.
   ========================================================================== */

let POLS=[];
const TIERN2=['Chiefdom','Lordship','Principality','Kingdom','Empire'];
const TIERADJ=['petty','minor','great','royal','imperial'];

function polityTierByPop(p){
  let pop=0; for(const sid of p.sites) pop+=SITES[sid].pop;
  const v=p.vassals.length;
  if(pop>2200000||v>=14) return 4;
  if(pop>620000||v>=8) return 3;
  if(pop>170000||v>=4) return 2;
  if(pop>40000||v>=1) return 1;
  return 0;
}

function newPolity(seed,r,site,ruler,year){
  const cult=CULTURES[site.culture];
  const lang=LANGS[cult.lang];
  const nm = chance(r,0.55)
     ? {t:site.name, g:'of '+site.name}
     : lang.unique(sampleK(r,tileConcepts(site.tile).concat(['realm','land']),2),{});
  const p={
    id:POLS.length, name:nm.t, gloss:nm.g, native:nm.t,
    capital:site.id, ruler: ruler? ruler.id : -1, dyn: ruler? ruler.dyn : -1,
    culture:site.culture, faith:site.faith,
    sites:[], liege:-1, vassals:[], tier:0,
    treasury: 60, legit: 0.62, central: rf(r,0.25,0.65), autonomy:0.4,
    rel:new Map(), truce:new Map(), wars:[], claims:[], armies:[],
    manpower:0, mpMax:0, prestige:0, stability:0.6, marriages:0,
    born:year, ended:-1, alive:true, capitalTile:site.tile,
    color: hsl(hashStr('pol'+POLS.length+nm.t,seed)/4294967296, 0.52, 0.55),
    warExhaust:0, lastWar:-999, rulerSince:year, rulers:[], levyPool:0,
    integrity:1, cores:new Set(), history:[]
  };
  POLS.push(p);
  polityAdd(p,site);
  if(ruler){ ruler.titles.push(p.id); ruler.court=site.id; ruler.site=site.id; }
  return p;
}
function P(id){ return id>=0&&id<POLS.length? POLS[id] : null; }
function polityAdd(p,s){
  if(s.polity===p.id) return;
  if(s.polity>=0){
    const o=POLS[s.polity];
    if(o){ const k=o.sites.indexOf(s.id); if(k>=0) o.sites.splice(k,1); }
  }
  s.polity=p.id; p.sites.push(s.id);
  p.cores.add(s.id);
  for(const t of s.hinter) T.owner[t]=p.id;
  T.owner[s.tile]=p.id;
}
function polityPop(p){
  if(p._py===YEAR) return p._pv;
  let v=0; for(const sid of p.sites){ const s=SITES[sid]; if(s) v+=s.pop; }
  p._py=YEAR; p._pv=v; return v;
}
/* Strength is asked for many times a year by many callers; compute it once. */
function polityStr(p,depth){
  depth=depth||0;
  if(p._sy===YEAR) return p._sv;
  if(depth>8) return 0;
  let v=0;
  for(const sid of p.sites){ const s=SITES[sid]; if(s) v+=s.manpower*(1-0.5*s.devast); }
  for(const vid of p.vassals){ const q=POLS[vid]; if(q&&q.alive) v+=polityStr(q,depth+1)*contractLevy(q); }
  p._sy=YEAR; p._sv=v; return v;
}
function contractLevy(p){
  const l=POLS[p.liege];
  if(!l) return 1;
  const base=0.5+0.35*l.central;
  const op = opinionVassal(p);
  return clamp(base*(0.5+0.5*clamp((op+60)/120,0,1)),0.05,0.95);
}
function opinionVassal(p){
  const l=POLS[p.liege]; if(!l) return 0;
  const a=C(p.ruler), b=C(l.ruler);
  if(!a||!b) return 0;
  let v=opinion(a,b,YEAR);
  v -= l.central*40;
  v += (l.legit-0.5)*30;
  if(p.culture!==l.culture) v-=14;
  if(p.faith!==l.faith) v-=20;
  return v;
}
function polityLord(p){ return C(p.ruler); }
function realmOf(p){ let q=p, n=0; while(q.liege>=0&&n++<12){ const l=POLS[q.liege]; if(!l||!l.alive) break; q=l; } return q; }
function allVassals(p,out,depth){
  out=out||[]; depth=depth||0;
  if(depth>8||out.length>400) return out;
  for(const v of p.vassals){ const q=POLS[v]; if(q&&q.alive&&out.indexOf(q)<0){ out.push(q); allVassals(q,out,depth+1); } }
  return out;
}

/* --------------------------------------------------------------- relations  */
function setRelation(a,b,dv,why,year,decay){
  if(!a||!b||a===b) return;
  let e=a.rel.get(b.id);
  if(!e){ e={v:0,m:[]}; a.rel.set(b.id,e); }
  e.m.push({t:why,v:dv,y:year,d:decay===undefined?0.94:decay});
  if(e.m.length>8) e.m.shift();
  let e2=b.rel.get(a.id);
  if(!e2){ e2={v:0,m:[]}; b.rel.set(a.id,e2); }
  e2.m.push({t:why,v:dv,y:year,d:decay===undefined?0.94:decay});
  if(e2.m.length>8) e2.m.shift();
}
function relation(a,b){
  if(!a||!b||a===b) return 100;
  let v=0;
  const e=a.rel.get(b.id);
  if(e) for(const m of e.m) v+=m.v;
  const ca=CULTURES[a.culture], cb=CULTURES[b.culture];
  v -= 30*cultureGap(ca,cb)*(0.3+ca.vals.xeno);
  if(a.faith!==b.faith&&a.faith>=0&&b.faith>=0){
    const fa=FAITHS[a.faith], fb=FAITHS[b.faith];
    v -= 40*faithGap(fa,fb)*(0.25+0.75*(1-fa.tolerance));
  } else v+=14;
  const ra=C(a.ruler), rb=C(b.ruler);
  if(ra&&rb) v += opinion(ra,rb,YEAR)*0.35;
  if(a.liege===b.id||b.liege===a.id) v+=25;
  return clamp(Math.round(v),-200,200);
}
function decayRelations(p){
  for(const [k,e] of p.rel){
    for(const m of e.m) m.v*=m.d;
    e.m=e.m.filter(m=>Math.abs(m.v)>0.7);
    if(!e.m.length) p.rel.delete(k);
  }
  for(const [k,y] of p.truce) if(y<YEAR) p.truce.delete(k);
}
function hasTruce(a,b){ const y=a.truce.get(b.id); return y!==undefined&&y>=YEAR; }

/* --------------------------------------------------------------- naming     */
function polityTitle(p){
  const t=p.tier;
  if(p.liege>=0) return (t>=3?'the Grand Duchy of ':'the Lordship of ')+p.name;
  return 'the '+TIERN2[t]+' of '+p.name;
}
function polityShort(p){ return p.name; }

/* --------------------------------------------------------------- succession */
function heirsOf(p,year){
  const rl=C(p.ruler);
  if(!rl) return [];
  const cult=CULTURES[p.culture];
  const law=cult.succ, glaw=cult.gender;
  const okSex=(ch)=>{
    if(glaw==='agnatic') return ch.sex==='m';
    if(glaw==='enatic')  return ch.sex==='f';
    return true;
  };
  const sexRank=(ch)=>{
    if(glaw==='agnatic-cognatic') return ch.sex==='m'?0:1;
    if(glaw==='enatic-cognatic')  return ch.sex==='f'?0:1;
    return 0;
  };
  let pool=[];
  const kids=rl.kids.map(C).filter(c=>c&&alive(c)&&!c.bastard&&okSex(c));
  if(law==='primogeniture'||law==='partible'||law==='appointment'){
    pool=kids.slice().sort((a,b)=> sexRank(a)-sexRank(b) || a.born-b.born);
  }else if(law==='ultimogeniture'){
    pool=kids.slice().sort((a,b)=> sexRank(a)-sexRank(b) || b.born-a.born);
  }else if(law==='seniority'){
    const d=rl.dyn>=0?DYNS[rl.dyn]:null;
    pool=(d? d.members.map(C):[]).filter(c=>c&&alive(c)&&okSex(c)&&c.id!==rl.id)
        .sort((a,b)=> sexRank(a)-sexRank(b) || a.born-b.born);
  }else if(law==='tanistry'){
    const d=rl.dyn>=0?DYNS[rl.dyn]:null;
    pool=(d? d.members.map(C):[]).filter(c=>c&&alive(c)&&okSex(c)&&c.id!==rl.id&&ageOf(c,year)>=14)
        .sort((a,b)=> (b.sk.mar+b.sk.dip+b.prestige/40)-(a.sk.mar+a.sk.dip+a.prestige/40));
  }else if(law==='elective'){
    const cands=[];
    for(const vid of p.vassals){ const q=POLS[vid]; const c=q&&C(q.ruler); if(c&&alive(c)&&okSex(c)) cands.push(c); }
    for(const k of kids) cands.push(k);
    const votes=new Map();
    const voters=p.vassals.map(v=>POLS[v]).filter(q=>q&&q.alive).map(q=>C(q.ruler)).filter(alive);
    for(const c of cands) votes.set(c.id,c.prestige/50+c.sk.dip*0.2);
    for(const v of voters){
      let best=null,bv=-1e9;
      for(const c of cands){ const o=opinion(v,c,year)+(v.dyn===c.dyn?25:0); if(o>bv){bv=o;best=c;} }
      if(best) votes.set(best.id,(votes.get(best.id)||0)+1);
    }
    pool=cands.sort((a,b)=>(votes.get(b.id)||0)-(votes.get(a.id)||0));
  }
  if(!pool.length){
    /* the line fails: look to siblings, then to the wider dynasty */
    const d=rl.dyn>=0?DYNS[rl.dyn]:null;
    if(d) pool=d.members.map(C).filter(c=>c&&alive(c)&&c.id!==rl.id&&okSex(c))
                .sort((a,b)=>a.born-b.born);
  }
  if(!pool.length&&rl.kids.length){
    pool=rl.kids.map(C).filter(c=>c&&alive(c)).sort((a,b)=>a.born-b.born);
  }
  return pool;
}

function succeed(p,year,r){
  const old=C(p.ruler);
  const cult=CULTURES[p.culture];
  const pool=heirsOf(p,year);
  if(old) p.rulers.push({id:old.id,from:p.rulerSince,to:year});
  if(old&&!alive(old)) p.ruler=-1;
  if(!pool.length){
    /* extinction: the strongest vassal or neighbour takes the throne */
    return interregnum(p,year,r);
  }
  const heir=pool[0];
  /* partible inheritance shatters realms */
  if(cult.succ==='partible'&&pool.length>1&&p.sites.length>=3&&p.liege<0){
    partition(p,pool,year,r);
    return;
  }
  crown(p,heir,year,r,old);
  /* disappointed claimants keep a claim, and some will press it */
  for(let k=1;k<pool.length&&k<4;k++){
    const c=pool[k];
    const str=clamp(0.85-0.16*k + (c.sk.dip+c.sk.mar)/90,0.2,0.95);
    c.claims.push({pol:p.id,str,since:year,why:'passed over in the succession'});
    if(chance(r,0.30+0.30*traitSum(c,'amb'))){
      chron(year,4,'claim',
        `${CHL(c)} disputes the succession in ${PL(p)}, naming ${CHL(heir)} a usurper.`,
        {chars:[c.id,heir.id],pols:[p.id]});
    }
  }
}
function crown(p,heir,year,r,old){
  if(!heir||!alive(heir)) return false;
  p.ruler=heir.id; p.dyn=heir.dyn; p.rulerSince=year;
  if(heir.titles.indexOf(p.id)<0) heir.titles.push(p.id);
  heir.court=p.capital; heir.site=p.capital;
  if(heir.dyn>=0) DYNS[heir.dyn].kings++;
  /* regnal number, counted once and remembered */
  if(!p.nameCount) p.nameCount=Object.create(null);
  p.nameCount[heir.name]=(p.nameCount[heir.name]||0)+1;
  heir.regnal=p.nameCount[heir.name];
  /* legitimacy */
  const legitimate = old? (heir.fa===old.id||heir.mo===old.id) : true;
  p.legit=clamp((legitimate?0.72:0.44)+ (heir.prestige/900) - (heir.bastard?0.18:0),0.05,1);
  if(heir.bastard) p.legit-=0.08;
  chron(year, p.tier>=3?4:(p.tier>=2?3:2),'crown',
    `${CHL(heir)} ${p.tier>=3?'is crowned':'takes the seat'} in ${PL(p)}${old? ', following the death of '+CHL(old):''}.`,
    {chars:[heir.id],pols:[p.id]});
  if(p.rulers.length>240) p.rulers.splice(0,120);
  /* vassals reassess */
  for(const vid of p.vassals){
    const q=POLS[vid]; if(!q||!q.alive) continue;
    const vr=C(q.ruler); if(!vr||!alive(vr)) continue;
    opine(vr,heir,-8+Math.round(heir.sk.dip*1.2)-Math.round(traitSum(heir,'cruel')*20),'a new liege',year);
  }
  return true;
}
function partition(p,pool,year,r){
  const heirs=pool.slice(0,Math.min(4,pool.length));
  const shares=[]; for(let k=0;k<heirs.length;k++) shares.push([]);
  const sites=p.sites.slice().sort((a,b)=>SITES[b].pop-SITES[a].pop);
  sites.forEach((sid,k)=>shares[k%heirs.length].push(sid));
  crown(p,heirs[0],year,r,null);
  const lost=[];
  for(let k=1;k<heirs.length;k++){
    if(!shares[k].length) continue;
    const cap=SITES[shares[k][0]];
    const np=newPolity(SEEDV,r,cap,heirs[k],year);
    for(const sid of shares[k]) polityAdd(np,SITES[sid]);
    np.legit=0.55; np.culture=p.culture; np.faith=p.faith;
    lost.push(np);
    setRelation(p,np,-25,'the realm was divided between us',year);
    /* brothers inherit each other's claims */
    heirs[k].claims.push({pol:p.id,str:0.7,since:year,why:'a brother’s portion'});
    heirs[0].claims.push({pol:np.id,str:0.7,since:year,why:'a brother’s portion'});
  }
  p.sites=p.sites.filter(sid=>SITES[sid].polity===p.id);
  chron(year,5,'partition',
    `On the death of its lord, ${PL(p)} is divided among ${plural(heirs.length,'heir')}. `+
    (lost.length? listify(lost.map(x=>PL(x)))+' are severed from it.' : ''),
    {pols:[p.id].concat(lost.map(x=>x.id)),chars:heirs.map(h=>h.id)});
}
function interregnum(p,year,r){
  const d=p.dyn>=0?DYNS[p.dyn]:null;
  if(d&&d.living<=0&&!d.extinct){
    d.extinct=true; d.ended=year;
    chron(year,5,'extinct',`The line of ${DL(d)} is ended. No heir of the blood remains.`,{dyns:[d.id]});
  }
  /* a vassal or a neighbouring lord seizes the vacant seat */
  const cands=[], seen=new Set();
  const add=c=>{ if(c&&alive(c)&&c.id!==p.ruler&&!seen.has(c.id)){ seen.add(c.id); cands.push(c); } };
  for(const vid of p.vassals){ const q=POLS[vid]; if(q&&q.alive) add(C(q.ruler)); }
  if(!cands.length){
    for(const s of nearbySites(p.capitalTile,26)){
      const q=P(s.polity);
      if(q&&q.alive&&q!==p) add(C(q.ruler));
    }
  }
  if(!cands.length){ dissolvePolity(p,year,'no heir, no claimant'); return; }
  const winner=cands.sort((a,b)=>(b.prestige+b.sk.mar*20)-(a.prestige+a.sk.mar*20))[0];
  p.ruler=-1;
  if(!crown(p,winner,year,r,null)){ dissolvePolity(p,year,'no heir, no claimant'); return; }
  p.legit=0.30;
  chron(year,4,'seize',`With the old line extinguished, ${CHL(winner)} seizes ${PL(p)}.`,
    {chars:[winner.id],pols:[p.id]});
}
function dissolvePolity(p,year,why){
  if(!p.alive) return;
  p.alive=false; p.ended=year;
  for(const sid of p.sites){ const s=SITES[sid]; if(s.polity===p.id) s.polity=-1; }
  for(const vid of p.vassals){ const q=POLS[vid]; if(q) q.liege=-1; }
  if(p.liege>=0){ const l=POLS[p.liege]; if(l){ const k=l.vassals.indexOf(p.id); if(k>=0) l.vassals.splice(k,1); } }
  p.vassals=[];
  chron(year,4,'fall',`${PL(p)} ceases to be. (${why})`,{pols:[p.id]});
}

/* --------------------------------------------------------------- vassalage  */
function vassalize(p,l,year,forced){
  if(p===l||p.liege===l.id) return;
  if(realmOf(l)===p) return;
  if(p.liege>=0){ const o=POLS[p.liege]; if(o){ const k=o.vassals.indexOf(p.id); if(k>=0) o.vassals.splice(k,1); } }
  p.liege=l.id; l.vassals.push(p.id);
  const a=C(p.ruler), b=C(l.ruler);
  if(a&&b) opine(a,b, forced? -30 : 12, forced?'forced my knee':'I swore freely', year);
  setRelation(p,l,forced?-20:20,forced?'submission at the sword-point':'sworn fealty',year);
  chron(year,3,'oath',`${PL(p)} ${forced?'is brought under':'swears fealty to'} ${PL(l)}.`,{pols:[p.id,l.id]});
}
function independence(p,year,why){
  if(p.liege<0) return;
  const l=POLS[p.liege];
  if(l){ const k=l.vassals.indexOf(p.id); if(k>=0) l.vassals.splice(k,1); setRelation(p,l,-60,'we broke our oath',year); }
  p.liege=-1;
  chron(year,4,'free',`${PL(p)} throws off the yoke of ${l?PL(l):'its liege'}. (${why})`,{pols:[p.id,l?l.id:-1]});
}

/* --------------------------------------------------------------- factions   */
function factionCheck(p,year,r){
  if(!p.vassals.length) return;
  const rl=C(p.ruler); if(!rl) return;
  const angry=[];
  let total=0, angryStr=0;
  for(const vid of p.vassals){
    const q=POLS[vid]; if(!q||!q.alive) continue;
    const st=polityStr(q); total+=st;
    const op=opinionVassal(q);
    if(op<-28) { angry.push({q,op,st}); angryStr+=st; }
  }
  total+=polityStr(p)*0.4;
  if(!angry.length||total<=0) return;
  const share=angryStr/total;
  if(share<0.34) return;
  const lead=angry.sort((a,b)=>b.st-a.st)[0].q;
  const leadR=C(lead.ruler);
  const kinds=[];
  if(p.central>0.4) kinds.push('lower_crown');
  if(CULTURES[p.culture].succ==='elective'||p.legit<0.45) kinds.push('depose');
  kinds.push('independence');
  const kind=pick(r,kinds);
  const power = share*(1+ (leadR? leadR.sk.dip/40:0));
  if(chance(r, clamp(0.10+power*0.35,0,0.6))){
    if(kind==='lower_crown'&&chance(r, clamp(0.35+p.legit*0.4,0,0.9))){
      p.central=clamp(p.central-0.12,0.05,1);
      chron(year,3,'faction',
        `${plural(angry.length,'lord')} of ${PL(p)} press their king; the crown's demands are eased.`,
        {pols:[p.id]});
      for(const a of angry){ const c=C(a.q.ruler); if(c&&rl) opine(c,rl,18,'the crown yielded',year); }
    }else{
      startCivilWar(p,angry.map(a=>a.q),kind,year,r);
    }
  }
}

/* --------------------------------------------------------------- plots      */
const PLOTS=[
  {k:'murder', n:'murder', skill:'int', base:0.10},
  {k:'imprison', n:'seizure', skill:'mar', base:0.12},
  {k:'forge',  n:'forged claim', skill:'lea', base:0.16},
  {k:'coup',   n:'usurpation', skill:'dip', base:0.07}
];
function plotTick(ch,year,r){
  if(!alive(ch)||ageOf(ch,year)<16) return;
  if(year-ch.lastPlot<4) return;
  const amb=traitSum(ch,'amb')+traitSum(ch,'plot')+(ch.sk.int-8)/24;
  if(amb<0.12) return;
  /* choose a target the character genuinely hates or covets */
  let target=null, kind=null, why='';
  const myPol = ch.titles.length? POLS[ch.titles[0]] : null;
  if(ch.claims.length&&chance(r,0.5)){
    const cl=pick(r,ch.claims); const tp=P(cl.pol);
    if(tp&&tp.alive&&tp.ruler>=0&&tp.ruler!==ch.id){ target=C(tp.ruler); kind='murder'; why='to clear my path to '+tp.name; }
  }
  if(!target&&ch.rel){
    let worst=null,wv=0;
    for(const [k,e] of ch.rel){ const o=C(k); if(o&&alive(o)&&e.v<wv){ wv=e.v; worst=o; } }
    if(worst&&wv<-45){ target=worst; kind=chance(r,0.6)?'murder':'imprison'; why='an old hatred'; }
  }
  if(!target&&myPol&&myPol.liege>=0&&chance(r,0.25)){
    const l=POLS[myPol.liege]; const lr=C(l.ruler);
    if(lr&&opinion(ch,lr,year)<-20){ target=lr; kind='coup'; why='my liege is unworthy'; }
  }
  if(!target&&chance(r,0.07)){ kind='forge'; }
  if(!kind) return;
  ch.lastPlot=year;
  if(kind==='forge'){
    /* fabricate a claim on a neighbour */
    const near=nearbySites(ch.site>=0?SITES[ch.site].tile:0,30);
    const cands=near.map(s=>P(s.polity)).filter(p=>p&&p.alive&&p.ruler!==ch.id);
    if(!cands.length) return;
    const tp=pick(r,cands);
    if(chance(r, clamp(0.08+ch.sk.lea*0.014,0,0.35))){
      ch.claims.push({pol:tp.id,str:0.45,since:year,why:'a document of doubtful provenance'});
      if(chance(r,0.4)) chron(year,3,'fabricate',
        `${CHL(ch)} produces a parchment naming ${CHL(ch)} rightful lord of ${PL(tp)}. Its ink is suspiciously fresh.`,
        {chars:[ch.id],pols:[tp.id]});
    }
    return;
  }
  if(!target||!alive(target)) return;
  /* recruit: anyone who also hates the target */
  const helpers=[];
  if(ch.rel) for(const [k,e] of ch.rel){
    const o=C(k); if(!o||!alive(o)) continue;
    if(e.v>20 && opinion(o,target,year)<-25 && helpers.length<3) helpers.push(o);
  }
  const P0=PLOTS.find(p=>p.k===kind);
  let odds=P0.base + ch.sk[P0.skill]*0.020 + helpers.length*0.055 - target.sk.int*0.014;
  odds += traitSum(ch,'plot')*0.15;
  if(traitHas(target,'paranoid')) odds-=0.07;
  odds=clamp(odds,0.02,0.62);
  if(!chance(r,odds*0.5)) return;                    /* the plot needs time */
  if(chance(r,odds)){
    if(kind==='murder'){
      const cause=pick(r,['poison at table','a knife in the dark','a fall from a tower stair',
        'a hunting accident that was no accident','a fever that came on too fast','a strangling in his sleep']);
      killChar(target,year,cause,ch.id);
      chron(year, target.titles.length?5:3,'murder',
        `${CHL(target)} is dead — ${cause}. ${helpers.length?'Whispers name ':'Whispers name '}${CHL(ch)}.`,
        {chars:[ch.id,target.id]});
      if(target.titles.length){ for(const tid of target.titles.slice()){ const tp=P(tid); if(tp&&tp.ruler===target.id) succeed(tp,year,r); } }
      if(chance(r,0.45)) addTrait(ch,'deceitful',year);
      /* discovery */
      if(chance(r,0.35)){
        for(const kid of target.kids){ const q=C(kid); if(q&&alive(q)){
          opine(q,ch,-90,'murdered my kin',year);
          q.grudge.push({c:ch.id,d:ch.dyn,w:55,y:year,why:'the murder of '+target.name});
        }}
      }
    }else if(kind==='imprison'){
      target.prison=ch.id;
      chron(year,3,'prison',`${CHL(ch)} takes ${CHL(target)} captive.`,{chars:[ch.id,target.id]});
      opine(target,ch,-70,'held me in chains',year);
    }else if(kind==='coup'){
      const tp=target.titles.length? P(target.titles[0]) : null;
      if(tp&&tp.alive){
        chron(year,5,'coup',`${CHL(ch)} seizes the seat of ${PL(tp)}; ${CHL(target)} is cast down.`,
          {chars:[ch.id,target.id],pols:[tp.id]});
        target.titles=target.titles.filter(t=>t!==tp.id);
        crown(tp,ch,year,r,target);
        tp.legit=0.28;
        addTrait(ch,'oathbreaker',year);
        target.claims.push({pol:tp.id,str:0.9,since:year,why:'I was cast down from this seat'});
      }
    }
  }else{
    /* caught */
    if(chance(r,0.55)){
      opine(target,ch,-80,'plotted against me',year);
      chron(year,3,'foiled',`A plot against ${CHL(target)} is uncovered. ${CHL(ch)} denies everything.`,
        {chars:[ch.id,target.id]});
      if(chance(r,0.3)&&target.titles.length){ ch.prison=target.id; }
    }
  }
}
/* ============================================================================
   PART VIII — THE SWORD
   Wars are declared for reasons the world produced. Armies eat, freeze,
   desert, and die at named places. Peace redraws the map and plants the
   next war's grievance.
   ========================================================================== */

let WARS=[], ARMIES=[], armySeq=0;

const CB=[
 {k:'claim',    n:'a pressed claim',        w:1.00, t:'War of the Claim'},
 {k:'succession',n:'a disputed succession', w:1.10, t:'War of Succession'},
 {k:'conquest', n:'naked conquest',         w:0.38, t:''},
 {k:'holy',     n:'holy war',               w:0.95, t:'Holy War'},
 {k:'liberate', n:'the liberation of kin',  w:0.85, t:'War of Liberation'},
 {k:'trade',    n:'the closing of the roads',w:0.55, t:'War of the Roads'},
 {k:'vengeance',n:'a blood debt',           w:0.80, t:'War of the Blood Debt'},
 {k:'tribute',  n:'a demand of tribute',    w:0.50, t:'Tribute War'},
 {k:'reconquest',n:'the recovery of lost lands',w:0.95, t:'War of Recovery'},
 {k:'independence',n:'independence',        w:1.00, t:'War of Independence'},
 {k:'depose',   n:'the deposition of a tyrant',w:1.00, t:'War of the Crown'},
 {k:'crown',    n:'the crown itself',       w:1.20, t:'War of the Crown'}
];
const CBI={}; CB.forEach(c=>CBI[c.k]=c);

function atWar(a,b){
  if(a<0||b<0||a===b) return false;
  const pa=P(a); if(!pa) return false;
  for(const wid of pa.wars){
    const w=WARS[wid]; if(!w||w.ended>=0) continue;
    if(sideOf(w,a)!==sideOf(w,b)&&sideOf(w,b)!==0) return true;
  }
  return false;
}
function sideOf(w,pid){
  if(w.atk.indexOf(pid)>=0) return 1;
  if(w.def.indexOf(pid)>=0) return -1;
  return 0;
}
function warName(w){
  const a=P(w.atk[0]), d=P(w.def[0]);
  return w.title;
}

/* ---------------------------------------------------------- casus belli     */
function findCB(a,b,year,r,blocked,lost){
  const out=[];
  const ra=C(a.ruler), rb=C(b.ruler);
  if(!ra||!rb) return out;
  /* pressed claim held by our ruler or close kin */
  for(const cl of ra.claims) if(cl.pol===b.id) out.push({k:'claim',str:cl.str,why:cl.why,tgt:b.id});
  for(const kid of ra.kids){ const c=C(kid); if(c&&alive(c))
    for(const cl of c.claims) if(cl.pol===b.id) out.push({k:'claim',str:cl.str*0.8,why:'my child’s claim',tgt:b.id}); }
  /* lost cores */
  if(lost===undefined){ lost=0; for(const sid of a.cores){ const s=SITES[sid]; if(s&&s.polity===b.id) lost++; } }
  if(lost) out.push({k:'reconquest',str:clamp(0.3+lost*0.16,0,1),why:plural(lost,'town')+' once ours',tgt:b.id});
  /* kin under a foreign yoke */
  let kin=0;
  for(const sid of b.sites) if(SITES[sid].culture===a.culture) kin++;
  if(kin>=2&&b.culture!==a.culture)
    out.push({k:'liberate',str:clamp(kin/Math.max(3,b.sites.length),0,1),why:plural(kin,'town')+' of our own blood under their lords',tgt:b.id});
  /* the faith */
  if(a.faith>=0&&b.faith>=0&&a.faith!==b.faith){
    const fa=FAITHS[a.faith];
    const gap=faithGap(fa,FAITHS[b.faith]);
    let holySites=0;
    for(const t of fa.holy) if(T.owner[t]===b.id) holySites++;
    const s=gap*fa.militancy + holySites*0.35;
    if(s>0.45) out.push({k:'holy',str:clamp(s,0,1.2),
      why: holySites? plural(holySites,'holy place')+' in unbelieving hands' : 'their gods are false',tgt:b.id});
  }
  /* blood debts */
  for(const g of ra.grudge) if(rb.dyn>=0&&g.d===rb.dyn)
    out.push({k:'vengeance',str:clamp(g.w/60,0,1),why:g.why,tgt:b.id});
  /* the roads */
  if(blocked===undefined){ blocked=0;
    for(const sid of a.sites){ const s=SITES[sid]; if(!s) continue;
      for(const l of s.links){ const o=SITES[l.to]; if(o&&o.polity===b.id&&l.traffic>30) blocked++; } } }
  if(blocked>2&&relation(a,b)<-20)
    out.push({k:'trade',str:clamp(blocked/12,0,0.7),why:'they choke our trade',tgt:b.id});
  /* raw hunger for land */
  if(!out.length){
    const sa=polityStr(a), sb=polityStr(b);
    if(sa>sb*2.0 && relation(a,b)<-5 && a.legit>0.45)
      out.push({k:'conquest',str:0.4,
        why:pick(r,['they are weak and we are not','the border has always been an argument',
                    'their lords have no friends left','a king must be seen to take something']),
        tgt:b.id});
  }
  return out;
}

/* ------------------------------------------------------------- declaration  */
function considerWar(a,year,r){
  if(!a.alive||a.liege>=0) return;
  if(year-a.lastWar<7) return;
  if(a.warExhaust>0.55) return;
  const rl=C(a.ruler); if(!rl) return;
  if(a.wars.filter(w=>WARS[w]&&WARS[w].ended<0).length>=(a.sites.length>7?2:1)) return;
  /* neighbours only */
  const seen=new Set();
  const cands=[];
  for(const sid of a.sites){
    const s=SITES[sid];
    for(const l of s.links){
      const o=SITES[l.to]; const q=P(o.polity);
      if(q&&q.alive&&q!==a&&!seen.has(q.id)&&realmOf(q)!==realmOf(a)){ seen.add(q.id); cands.push(q); }
    }
  }
  if(!cands.length) return;
  let best=null,bv=0,bcb=null;
  const aggr = 0.5 + traitSum(rl,'aggr') + CULTURES[a.culture].vals.martial*0.6
             + (a.legit<0.45?0.25:0) - (a.treasury<0?0.3:0);
  /* one pass over our own holdings answers "who blocks our roads" for everyone */
  const blockedBy=new Map(), lostTo=new Map();
  for(const sid of a.sites){ const s=SITES[sid]; if(!s) continue;
    for(const l of s.links){ const o=SITES[l.to];
      if(o&&o.polity>=0&&o.polity!==a.id&&l.traffic>30)
        blockedBy.set(o.polity,(blockedBy.get(o.polity)||0)+1); } }
  for(const sid of a.cores){ const s=SITES[sid];
    if(s&&s.polity>=0&&s.polity!==a.id) lostTo.set(s.polity,(lostTo.get(s.polity)||0)+1); }
  const sa=polityStr(a)+alliedStrength(a);
  const myPop=Math.max(1,polityPop(a));
  for(const b of cands){
    if(hasTruce(a,b)) continue;
    const rb=realmOf(b);
    const cbs=findCB(a,b,year,r,blockedBy.get(b.id)||0,lostTo.get(b.id)||0);
    if(!cbs.length) continue;
    const cb=cbs.sort((x,y)=>(y.str*CBI[y.k].w)-(x.str*CBI[x.k].w))[0];
    const sb=polityStr(rb)+alliedStrength(rb);
    if(sb<=0) continue;
    const ratio=sa/(sb+1);
    const prize = polityPop(rb)/myPop;
    const dist = tdist(a.capitalTile,b.capitalTile)/40;
    let v = (ratio-0.95)*1.5 + cb.str*CBI[cb.k].w*1.35 + prize*0.35 - dist*0.5
          - a.warExhaust*1.2 + (relation(a,rb)<-40?0.5:0);
    v *= aggr;
    if(v>bv){ bv=v; best=rb; bcb=cb; }
  }
  if(best&&bv>1.05&&chance(r,clamp(bv*0.075,0.01,0.30))) declareWar(a,best,bcb,year,r);
}
function alliedStrength(p){
  let v=0;
  for(const [k,e] of p.rel){
    const q=P(k);
    if(q&&q.alive&&q.ally===p.id) v+=polityStr(q)*0.5;
  }
  return v;
}

function declareWar(a,b,cb,year,r,forceTitle){
  const lang=LANGS[CULTURES[a.culture].lang];
  const w={
    id:WARS.length, atk:[a.id], def:[b.id], cb:cb.k, why:cb.why,
    start:year, ended:-1, score:0, battles:[], sieges:[], occ:[],
    title: forceTitle || warTitle(a,b,cb,year),
    atkCasualties:0, defCasualties:0, sacked:[], target:cb.tgt
  };
  WARS.push(w);
  a.wars.push(w.id); b.wars.push(w.id);
  a.lastWar=year; b.lastWar=year;
  setRelation(a,b,-70,'they made war upon us',year,0.97);
  /* allies are called; refusing costs honour */
  callAllies(w,a,1,year,r); callAllies(w,b,-1,year,r);
  /* vassals fight for their liege */
  for(const q of allVassals(a)) if(w.atk.indexOf(q.id)<0){ w.atk.push(q.id); q.wars.push(w.id); }
  for(const q of allVassals(b)) if(w.def.indexOf(q.id)<0){ w.def.push(q.id); q.wars.push(w.id); }
  chron(year,5,'war',
    `${PL(a)} declares war upon ${PL(b)} — ${CBI[cb.k].n}: ${cb.why}. The ${cap(w.title)} begins.`,
    {pols:[a.id,b.id],wars:[w.id]});
  raiseArmies(a,w,year,r); raiseArmies(b,w,year,r);
}
function warTitle(a,b,cb,year){
  const r=stream(year*104729+a.id*31+b.id,'wartitle');
  const t=CBI[cb.k].t;
  const forms=[
    ()=>'War of '+a.name+' and '+b.name,
    ()=>pick(r,['Great','Long','Bitter','Winter','Summer','Iron','Bloody','Second','Third','Cold','Red'])+' War of '+b.name,
    ()=>'War for '+b.name,
    ()=>t? t+' of '+b.name : 'War of '+a.name+' and '+b.name,
    ()=>t? t+' of '+b.name : 'War for '+b.name
  ];
  return pick(r,forms)().replace(/^the /i,'');
}
function callAllies(w,p,side,year,r){
  for(const [k,e] of p.rel){
    const q=P(k);
    if(!q||!q.alive||q.ally!==p.id) continue;
    const rq=C(q.ruler);
    const willing = relation(q,p)*0.01 + (rq? (traitHas(rq,'honest')?0.25:0)-(traitHas(rq,'craven')?0.3:0):0)
                  - q.warExhaust*0.8 + 0.3;
    if(chance(r,clamp(willing,0.05,0.92))){
      (side>0? w.atk : w.def).push(q.id); q.wars.push(w.id);
      chron(year,3,'ally',`${PL(q)} answers the call and joins the ${cap(w.title)}.`,{pols:[q.id,p.id],wars:[w.id]});
      raiseArmies(q,w,year,r);
    }else{
      setRelation(q,p,-45,'refused the call to arms',year);
      q.ally=-1; p.ally = p.ally===q.id? -1 : p.ally;
      if(rq) addTrait(rq,'oathbreaker',year);
      chron(year,3,'refuse',`${PL(q)} refuses the call of ${PL(p)}. The alliance is broken.`,{pols:[q.id,p.id]});
    }
  }
}

/* ------------------------------------------------------------- armies       */
function polityManpower(p,depth){
  depth=depth||0;
  if(p._my===YEAR) return p._mv;
  if(depth>8) return 0;
  let mp=0;
  for(const sid of p.sites){ const s=SITES[sid]; if(s) mp+=s.manpower; }
  for(const vid of p.vassals){ const q=P(vid); if(q&&q.alive) mp+=polityManpower(q,depth+1)*contractLevy(q); }
  p._my=YEAR; p._mv=mp; return mp;
}
function raiseArmies(p,w,year,r){
  const cap=polityManpower(p);
  const avail=Math.max(0,cap-p.levyPool);
  if(avail<45) return;
  const c=CULTURES[p.culture];
  const take=Math.min(avail, cap*rf(r,0.45,0.80));
  p.levyPool+=take;
  const n=clamp(Math.round(take/1800),1,4);
  const per=take/n;
  /* the best sword in the realm leads, if he is not the king himself */
  const pool=[];
  const rl=C(p.ruler); if(rl) pool.push(rl);
  for(const vid of p.vassals){ const q=P(vid); const cc=q&&C(q.ruler); if(cc&&alive(cc)) pool.push(cc); }
  if(rl) for(const kid of rl.kids){ const cc=C(kid); if(cc&&alive(cc)&&ageOf(cc,year)>=16) pool.push(cc); }
  for(const sid of p.sites){ const hd=C(SITES[sid].holder);
    if(hd&&alive(hd)&&ageOf(hd,year)>=16&&pool.indexOf(hd)<0) pool.push(hd); }
  pool.sort((a,b)=>b.sk.mar-a.sk.mar);
  for(let k=0;k<n;k++){
    const cmd=pool[k%Math.max(1,pool.length)]||null;
    const qual = 0.72 + techEffect(c,'mil') + c.vals.martial*0.30 + SPECIES[c.species].war*0.18
               + (p.treasury>200?0.10:0);
    const a={
      id:armySeq++, pol:p.id, war:w.id, tile:p.capitalTile,
      size:Math.round(per), max:Math.round(per), qual,
      morale:0.85, supply:1.0, cmd: cmd?cmd.id:-1,
      path:null, pi:0, dest:-1, destYear:year, siege:null, home:p.capitalTile,
      atSite:p.capital, prevSite:-1, hopTo:undefined, idle:0,
      side: sideOf(w,p.id), routed:0, naval:0
    };
    ARMIES.push(a);
  }
}
function disband(a){
  const p=P(a.pol);
  if(p){ p.levyPool=Math.max(0,p.levyPool-a.max*0.7); }
  const k=ARMIES.indexOf(a); if(k>=0) ARMIES.splice(k,1);
}

/* Pick the most valuable enemy holding this army can actually reach. */
function chooseTarget(a,year){
  const w=WARS[a.war]; if(!w||w.ended>=0) return null;
  const enemy = a.side>0? w.def : w.atk;
  let best=null,bv=-1e9;
  for(const pid of enemy){
    const q=P(pid); if(!q||!q.alive) continue;
    for(const sid of q.sites){
      const s=SITES[sid];
      if(!s.alive||s.occupied===a.pol) continue;
      if(s.siege && sideOf(w,s.siege.by)===a.side) continue;   /* already invested */
      if(s.occupied>=0 && sideOf(w,s.occupied)===a.side) continue;
      const d=tdist(a.tile,s.tile);
      if(d>80) continue;
      let v = s.pop/1000 + (s.id===q.capital?9:0) + (T.harbor[s.tile]>0.5?2:0) - d*0.42 - s.walls*1.4;
      if(w.target===q.id) v+=3;
      if(v>bv){bv=v;best=s;}
    }
  }
  return best;
}
/* Hosts march by road, hop by hop along the settlement graph. Nobody runs a
   fresh forty-thousand-tile pathfind every month. */
function nextHop(a,tgt){
  const here=SITES[a.atSite];
  if(!here||!here.links.length) return null;
  let best=null,bv=1e18;
  for(const l of here.links){
    const o=SITES[l.to];
    if(!o||!o.alive) continue;
    if(l.to===a.prevSite && here.links.length>1) continue;
    const v = l.cost*0.9 + tdist(o.tile,tgt.tile)*3.0;
    if(v<bv){ bv=v; best=l; }
  }
  return best;
}
function armyMove(a,year,r){
  const w=WARS[a.war];
  if(!w||w.ended>=0){ disband(a); return; }
  const p=P(a.pol);
  if(!p||!p.alive||a.size<40){ disband(a); return; }
  /* supply and attrition */
  const own = T.owner[a.tile]===a.pol || (P(T.owner[a.tile])&&sideOf(w,T.owner[a.tile])===a.side);
  const forage = BIOME[T.biome[a.tile]].food + T.fert[a.tile]*0.5;
  const winter = T.temp[a.tile] - T.tvar[a.tile]*0.8;
  let attr = 0.008;
  if(!own) attr+=0.020;
  attr += Math.max(0,0.35-forage)*0.09;
  if(winter<-6) attr+=0.030;
  if(a.siege) attr+=0.012;
  attr *= (1 - clamp(techEffect(CULTURES[p.culture],'admin'),0,0.4));
  const loss=Math.round(a.size*attr);
  if(loss>0){ a.size-=loss; a.supply=clamp(a.supply-attr*1.5,0,1);
    if(a.side>0) w.atkCasualties+=loss; else w.defCasualties+=loss; }
  a.morale=clamp(a.morale + (own?0.02:0.005) - attr*2.2, 0.12, 1.25);
  if(a.size<a.max*0.45&&a.max-a.size>300&&chance(r,0.10)){
    chron(year,2,'attrition',`The host of ${PL(p)} melts away in the ${BIOME[T.biome[a.tile]].n.toLowerCase()} — ${commify(a.max-a.size)} gone to hunger and desertion.`,
      {pols:[p.id],wars:[w.id]});
    a.max=a.size;
  }
  if(a.size<40){ disband(a); return; }
  /* siege in progress? */
  if(a.siege!==null){ siegeStep(a,year,r); return; }

  /* choose (or keep) an objective */
  if(a.dest<0||!SITES[a.dest]||!SITES[a.dest].alive||
     (year-a.destYear>3) || SITES[a.dest].occupied===a.pol){
    const tgt=chooseTarget(a,year);
    if(!tgt){ a.path=null; a.dest=-1; return; }
    a.dest=tgt.id; a.destYear=year; a.path=null;
  }
  const tgt=SITES[a.dest];

  /* pick the next road leg when the current one is walked out */
  if(!a.path||a.pi>=a.path.length){
    if(a.atSite===a.dest){ arriveAt(a,tgt,year,r,w); return; }
    const hop=nextHop(a,tgt);
    if(!hop){ a.idle=(a.idle||0)+1; if(a.idle>6) disband(a); return; }
    a.idle=0;
    a.path=hop.path; a.pi=1; a.hopTo=hop.to;
  }
  /* march */
  let mp = (2.4 + techEffect(CULTURES[p.culture],'move')*3) * (a.routed>0? 1.5 : 1);
  if(a.routed>0) a.routed--;
  let guard=0;
  while(mp>0 && a.path && a.pi<a.path.length && guard++<64){
    const nxt=a.path[a.pi];
    const c=T.land[nxt]? T.cost[nxt]*(T.road[nxt]?0.5:1) : 1.6;
    if(c>mp && mp<2.4) break;
    mp-=c; a.tile=nxt; a.pi++;
    if(T.site[nxt]>=0){
      const s=SITES[T.site[nxt]];
      if(s&&s.alive){ const q=P(s.polity);
        if(q&&sideOf(w,q.id)===-a.side){ a.atSite=s.id; beginSiege(a,s,year,r); return; } }
    }
  }
  if(a.path && a.pi>=a.path.length){
    a.prevSite=a.atSite; a.atSite=a.hopTo!==undefined? a.hopTo : a.atSite;
    const here=SITES[a.atSite];
    if(here) a.tile=here.tile;
    a.path=null;
    if(here && a.atSite===a.dest) arriveAt(a,here,year,r,w);
  }
}
function arriveAt(a,s,year,r,w){
  if(!s||!s.alive) { a.dest=-1; return; }
  const q=P(s.polity);
  if(q&&sideOf(w,q.id)===-a.side) beginSiege(a,s,year,r);
  else a.dest=-1;
}

/* ------------------------------------------------------------- battle       */
function battlePower(a,defending,r){
  const p=P(a.pol); const c=CULTURES[p.culture];
  const cmd=C(a.cmd);
  let v=a.size*a.qual*(0.45+0.70*a.morale);
  if(cmd){
    v*= 1 + (cmd.sk.mar-8)*0.030
       + (traitHas(cmd,'brave')?0.06:0) - (traitHas(cmd,'craven')?0.10:0)
       + (traitHas(cmd,'shrewd')?0.05:0) - (traitHas(cmd,'dull')?0.05:0);
    if(cmd.arts.length) for(const aid of cmd.arts){ const it=ARTS[aid]; if(it&&it.eff==='mar') v*=1+it.pow*0.10; }
  }
  v *= 1 + techEffect(c,'mil');
  if(defending) v *= 1 + T.defen[a.tile]*0.60;
  v *= rf(r,0.78,1.28);
  return v;
}
/* All the hosts that meet on one field fight one battle, not several. */
function fieldBattle(tile,A,B,year,r){
  const w=WARS[A[0].war]; if(!w) return;
  const def = T.owner[tile]===B[0].pol;
  let va=0, vb=0;
  for(const x of A) va+=battlePower(x,!def,r);
  for(const x of B) vb+=battlePower(x,def,r);
  const winS = va>vb? A : B, loseS = va>vb? B : A;
  const ratio = Math.max(va,vb)/Math.max(1,Math.min(va,vb));
  const lossL = clamp(0.16+0.13*Math.min(3,ratio-1),0.10,0.55);
  const lossW = clamp(0.11/Math.max(1,ratio-0.2),0.020,0.16);
  let dL=0,dW=0;
  for(const x of loseS){ const d=Math.round(x.size*lossL); x.size-=d; dL+=d;
    x.morale=clamp(x.morale-0.35,0.10,1.2); x.routed=2; }
  for(const x of winS){ const d=Math.round(x.size*lossW); x.size-=d; dW+=d;
    x.morale=clamp(x.morale+0.16,0.1,1.3); }
  const cmdOf=list=>{ let best=null,bv=-1; for(const x of list){ const c=C(x.cmd);
    if(c&&alive(c)&&c.sk.mar>bv){bv=c.sk.mar;best=c;} } return best; };
  const cw=cmdOf(winS), cl=cmdOf(loseS);
  const place=placeName(tile);
  const winPol=winS[0].pol, losePol=loseS[0].pol;
  w.battles.push({year, tile, place, win:winPol, lose:losePol, dead:dL+dW,
                  cmdW:cw?cw.id:-1, cmdL:cl?cl.id:-1});
  if(w.battles.length>120) w.battles.splice(0,40);
  if(sideOf(w,winPol)>0){ w.score+=clamp((dL+dW)/900,0.5,7); w.defCasualties+=dL; w.atkCasualties+=dW; }
  else { w.score-=clamp((dL+dW)/900,0.5,7); w.atkCasualties+=dL; w.defCasualties+=dW; }
  if(cw){ cw.battles++; cw.wonBattles++; cw.prestige+=28+dL/40; }
  if(cl){ cl.battles++; cl.prestige-=12; }
  const dieP = 0.055 + (cl&&traitHas(cl,'brave')?0.05:0) + lossL*0.12;
  if(cl&&chance(r,dieP)){
    killChar(cl,year,'cut down at '+place,cw?cw.id:-1);
    for(const tid of cl.titles.slice()){ const tp=P(tid); if(tp&&tp.alive&&tp.ruler===cl.id) succeed(tp,year,r); }
  } else if(cl&&chance(r,0.10)&&cw){
    cl.prison=cw.id;
    chron(year,4,'capture',`${CHL(cl)} is taken alive at ${place}.`,{chars:[cl.id],wars:[w.id]});
  }
  if(cw&&chance(r,0.02)) killChar(cw,year,'a stray arrow at '+place,cl?cl.id:-1);
  if(cl&&chance(r,0.18)) addTrait(cl,'scarred',year);
  const hosts = (A.length+B.length)>2? ` ${plural(A.length+B.length,'host')} met on the field.` : '';
  chron(year,5,'battle',
    `${plural(dL+dW,'man','men')} fall at ${place}. ${PL(P(winPol))} breaks ${PL(P(losePol))}`+
    (cw? ' under '+CHL(cw):'')+'.'+hosts,
    {pols:[winPol,losePol],wars:[w.id],
     chars:[cw?cw.id:-1,cl?cl.id:-1].filter(x=>x>=0),tile});
  for(const x of loseS) if(x.size<40) disband(x);
  for(const x of winS) if(x.size<40) disband(x);
}
function fightBattle(a,b,year,r){
  const w=WARS[a.war]; if(!w) return;
  const pa=P(a.pol), pb=P(b.pol);
  const def = T.owner[a.tile]===b.pol;
  const va=battlePower(a,!def,r), vb=battlePower(b,def,r);
  const win = va>vb? a : b, lose = va>vb? b : a;
  const ratio = Math.max(va,vb)/Math.max(1,Math.min(va,vb));
  const lossL = clamp(0.16+0.13*Math.min(3,ratio-1),0.10,0.55);
  const lossW = clamp(0.11/Math.max(1,ratio-0.2),0.020,0.16);
  const dL=Math.round(lose.size*lossL), dW=Math.round(win.size*lossW);
  lose.size-=dL; win.size-=dW;
  lose.morale=clamp(lose.morale-0.35,0.10,1.2);
  win.morale=clamp(win.morale+0.16,0.1,1.3);
  lose.routed=2;
  const place=placeName(a.tile);
  const bt={year, tile:a.tile, place, win:win.pol, lose:lose.pol, dead:dL+dW, cmdW:win.cmd, cmdL:lose.cmd};
  w.battles.push(bt);
  if(sideOf(w,win.pol)>0) { w.score+= clamp((dL+dW)/900,0.5,7); w.defCasualties+=dL; }
  else { w.score-= clamp((dL+dW)/900,0.5,7); w.atkCasualties+=dL; }
  const cw=C(win.cmd), cl=C(lose.cmd);
  if(cw){ cw.battles++; cw.wonBattles++; cw.prestige+=28+dL/40; }
  if(cl){ cl.battles++; cl.prestige-=12; }
  /* lords die in battle */
  const dieP = 0.055 + (cl&&traitHas(cl,'brave')?0.05:0) + lossL*0.12;
  if(cl&&chance(r,dieP)){
    killChar(cl,year,'cut down at '+place,win.cmd);
    for(const tid of cl.titles.slice()){ const tp=P(tid); if(tp&&tp.ruler===cl.id) succeed(tp,year,r); }
  } else if(cl&&chance(r,0.10)){
    cl.prison=win.cmd;
    chron(year,4,'capture',`${CHL(cl)} is taken alive at ${place}.`,{chars:[cl.id],wars:[w.id]});
  }
  if(cw&&chance(r,0.02)) killChar(cw,year,'a stray arrow at '+place,lose.cmd);
  if(cl&&chance(r,0.18)) addTrait(cl,'scarred',year);
  chron(year,5,'battle',
    `${plural(dL+dW,'man','men')} fall at ${place}. ${PL(P(win.pol))} breaks ${PL(P(lose.pol))}`+
    (cw? ' under '+CHL(cw):'')+'.',
    {pols:[win.pol,lose.pol],wars:[w.id],chars:[cw?cw.id:-1,cl?cl.id:-1].filter(x=>x>=0),tile:a.tile});
  if(lose.size<40) disband(lose);
}
/* Battlefields get named the way real ones do: after the nearest thing that
   already had a name, in the tongue of whoever lives there. */
const PLACECACHE=new Map();
function placeName(i){
  const sid=T.site[i];
  if(sid>=0&&SITES[sid]) return SITES[sid].name;
  const hit=PLACECACHE.get(i); if(hit) return hit;
  const r=stream(i*7919+1,'place');
  let lang=null, near=null;
  const d=T.dom[i];
  if(d>=0&&SITES[d]) { near=SITES[d]; lang=LANGS[CULTURES[near.culture].lang]; }
  if(!lang){
    const ns=nearbySites(i,20);
    if(ns.length){ near=ns[0]; lang=LANGS[CULTURES[near.culture].lang]; }
  }
  if(!lang) lang=LANGS[(i>>3)%LANGS.length];
  const f=tileConcepts(i);
  const feat=pick(r,['Ford','Ridge','Moor','Crossing','Hollow','Downs','Marches','Wold','Field',
                     'Heath','Bridge','Gate','Stones','Barrows','Meadow','Pass','Mire','Reach']);
  let nm;
  if(near&&chance(r,0.45)){
    nm = feat+' of '+near.name;                    /* named for the nearest hold */
  }else{
    const c=lang.compose(sampleK(r,f.length?f:['stone'],1));
    nm = c.t+' '+feat;
  }
  PLACECACHE.set(i,nm);
  if(PLACECACHE.size>4000) PLACECACHE.clear();
  return nm;
}

/* ------------------------------------------------------------- siege        */
function beginSiege(a,s,year,r){
  const w0=WARS[a.war];
  if(s.siege){
    if(w0 && sideOf(w0,s.siege.by)===a.side){
      /* reinforce the host already before the walls, do not start a second camp */
      const other=ARMIES.find(x=>x.id===s.siege.army);
      if(other&&other.siege){ other.siege.prog+=0.06; }
      a.dest=-1; a.path=null; return;
    }
  }
  if(s.occupied>=0 && w0 && sideOf(w0,s.occupied)===a.side){ a.dest=-1; a.path=null; return; }
  a.siege={site:s.id, prog:0, stores: 12+s.walls*10+s.granary*0.02, start:year};
  s.siege={by:a.pol, army:a.id, since:year};
  chron(year, s.tier>=3?4:(s.tier>=2?3:2),'siege',`${PL(P(a.pol))} lays siege to ${SL(s)}.`,
    {pols:[a.pol,s.polity],sites:[s.id],wars:[a.war]});
}
function siegeStep(a,year,r){
  const s=SITES[a.siege.site];
  if(!s||!s.alive||s.polity<0){ a.siege=null; return; }
  const w=WARS[a.war];
  if(!w||w.ended>=0||sideOf(w,s.polity)!==-a.side){ if(s.siege&&s.siege.army===a.id) s.siege=null; a.siege=null; return; }
  const p=P(a.pol), c=CULTURES[p.culture];
  const siegeT=1+techEffect(c,'siege');
  const fortT=1+techEffect(CULTURES[s.culture],'fort');
  a.siege.stores-=1;
  const rate = (a.size/Math.max(300,s.pop*0.08+300))*siegeT/(1+s.walls*0.85*fortT);
  a.siege.prog += rate;
  s.unrest+=0.015; s.devast=clamp(s.devast+0.012,0,1);
  const cmd=C(a.cmd);
  const assaultWant = a.siege.prog>0.55 || (cmd&&traitHas(cmd,'wroth')) || a.supply<0.4;
  if(assaultWant&&chance(r,0.20)){
    /* storm the walls */
    const odds=clamp(0.22+a.siege.prog*0.45+siegeT*0.12-s.walls*0.10,0.05,0.90);
    const dead=Math.round(a.size*rf(r,0.06,0.20));
    a.size-=dead;
    if(w){ if(a.side>0) w.atkCasualties+=dead; else w.defCasualties+=dead; }
    if(chance(r,odds)){
      captureSite(a,s,year,r,true);
    }else{
      if(dead>240) chron(year, dead>1200?4:3,'assault',
        `The assault on ${SL(s)} is thrown back; ${plural(dead,'man','men')} lie beneath the walls.`,
        {sites:[s.id],pols:[a.pol],wars:[w.id]});
      a.morale=clamp(a.morale-0.18,0.1,1.2);
      a.siege.prog=Math.max(0,a.siege.prog-0.20);
    }
    return;
  }
  if(a.siege.stores<=0||a.siege.prog>=1){
    captureSite(a,s,year,r,false);
  }
}
function captureSite(a,s,year,r,stormed){
  const w=WARS[a.war], p=P(a.pol);
  if(s.occupied>=0 && w && sideOf(w,s.occupied)===a.side){ a.siege=null; a.dest=-1; return; }
  const old=P(s.polity);
  s.siege=null; a.siege=null;
  s.occupied=a.pol;
  if(w){ w.occ.push(s.id); w.score += sideOf(w,a.pol)>0? clamp(s.pop/2200,0.6,7) : -clamp(s.pop/2200,0.6,7); }
  const cmd=C(a.cmd);
  const cruel = cmd? traitSum(cmd,'cruel') : 0;
  let sackP = (stormed?0.40:0.09) + cruel*0.45 + CULTURES[p.culture].vals.cruelty*0.25
            + (old&&old.faith!==p.faith? 0.14:0);
  if(year-(s.lastSack||-99)<12) sackP*=0.15;      /* there is little left to take */
  if(chance(r,clamp(sackP,0,0.85))){
    sack(s,a,year,r,cmd);
  }else{
    chron(year, s.tier>=3?4:(s.tier>=2?3:2),'take',`${SL(s)} opens its gates to ${PL(p)}${cmd? ' and '+CHL(cmd):''}.`,
      {sites:[s.id],pols:[p.id],wars:[w?w.id:-1],chars:cmd?[cmd.id]:[]});
  }
  if(cmd){ cmd.prestige+=40+s.pop/300; cmd.conquests++; }
}
function sack(s,a,year,r,cmd){
  const p=P(a.pol);
  const killed=s.pop*rf(r,0.08,0.30);
  const scale=killed/Math.max(1,s.pop);
  for(let k=0;k<NCLASS;k++) s.cls[k]*=(1-scale);
  s.pop*= (1-scale);
  const loot=s.wealth*0.6 + s.pop*0.02;
  s.wealth*=0.3; s.granary*=0.15;
  if(p) p.treasury+=loot*0.5;
  if(cmd){ cmd.gold+=loot*0.2; cmd.prestige+=25;
    if(chance(r,0.35)) addTrait(cmd,'cruel',year); }
  s.devast=clamp(s.devast+rf(r,0.25,0.60),0,1);
  s.unrest=clamp(s.unrest+0.45,0,1.6);
  s.sacked++; s.lastSack=year;
  for(const t of s.hinter) T.dev[t]=clamp(T.dev[t]+0.30,0,1);
  /* the books burn */
  const cu=CULTURES[s.culture];
  if(s.univ&&chance(r,0.5)) cu.vals.literacy=clamp(cu.vals.literacy-0.10,0,1);
  const w0=WARS[a.war];
  if(w0){ if(sideOf(w0,a.pol)>0) w0.defCasualties+=killed; else w0.atkCasualties+=killed; }
  chron(year,5,'sack',
    `${SL(s)} is sacked${cmd? ' by '+CHL(cmd):''}. ${commify(killed)} dead; the ${s.tier>=3?'city':'town'} burns.`,
    {sites:[s.id],pols:[p?p.id:-1],chars:cmd?[cmd.id]:[],wars:[a.war]});
  if(WARS[a.war]) WARS[a.war].sacked.push(s.id);
  /* the dead lord's kin remember who held the torch */
  if(cmd){
    const old=P(s.polity); const or_=old&&C(old.ruler);
    if(or_){ or_.grudge.push({c:cmd.id,d:cmd.dyn,w:45,y:year,why:'the sack of '+s.name});
             opine(or_,cmd,-80,'burned my city',year); }
  }
  if(s.pop<180&&chance(r,0.5)) ruinSite(s,year,'put to the torch');
}

/* ------------------------------------------------------------- peace        */
function warTick(w,year,r){
  if(w.ended>=0) return;
  const dur=year-w.start;
  const A=w.atk.map(P).filter(p=>p&&p.alive), D=w.def.map(P).filter(p=>p&&p.alive);
  if(!A.length||!D.length){ endWar(w,year,A.length?1:-1,r); return; }
  for(const p of A.concat(D)) p.warExhaust=clamp(p.warExhaust+0.018,0,1.4);
  const exA=A.reduce((s,p)=>s+p.warExhaust,0)/A.length;
  const exD=D.reduce((s,p)=>s+p.warExhaust,0)/D.length;
  const armiesA=ARMIES.filter(x=>sideOf(w,x.pol)>0&&x.war===w.id).length;
  const armiesD=ARMIES.filter(x=>sideOf(w,x.pol)<0&&x.war===w.id).length;
  let done=false, victor=0;
  if(w.score>=12+dur*0.2){ done=true; victor=1; }
  else if(w.score<=-12-dur*0.2){ done=true; victor=-1; }
  else if(dur>3&&(!armiesA||!armiesD)&&chance(r,0.35)){ done=true; victor= w.score>0?1:(w.score<0?-1:0); }
  else if(exA>0.85&&exD>0.85&&chance(r,0.4)){ done=true; victor=0; }
  else if(dur>22&&chance(r,0.25)){ done=true; victor= w.score>2?1:(w.score<-2?-1:0); }
  if(done) endWar(w,year,victor,r);
}
const NUMWORD=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
  'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen','Twenty'];
function endWar(w,year,victor,r){
  w.ended=year; w.victor=victor;
  const yrs=year-w.start;
  if(yrs>=8&&!w.civil){
    w.title = (NUMWORD[yrs]? NUMWORD[yrs]+" Years' War" : yrs+" Years' War")+
              (w.def.length&&P(w.def[0])? ' of '+P(w.def[0]).name : '');
  }
  const A=w.atk.map(P).filter(p=>p&&p.alive), D=w.def.map(P).filter(p=>p&&p.alive);
  const win = victor>0? A : D, lose = victor>0? D : A;
  for(const a of ARMIES.slice()) if(a.war===w.id) disband(a);
  for(const sid of w.occ){ const s=SITES[sid]; if(s) { s.occupied=-1; s.siege=null; } }
  const wa=A[0], wd=D[0];
  if(victor===0){
    if(wa&&wd){
      wa.truce.set(wd.id,year+8); wd.truce.set(wa.id,year+8);
      setRelation(wa,wd,20,'a white peace',year);
    }
    const fell0=Math.round(w.atkCasualties+w.defCasualties);
    chron(year,4,'peace',`The ${cap(w.title)} ends without victory. `+
      (fell0>20? plural(fell0,'man','men')+' died for nothing.' : 'Both sides claim they were about to win.'),
      {pols:[wa?wa.id:-1,wd?wd.id:-1],wars:[w.id]});
  }else{
    const V=win[0], L=lose[0];
    if(!V||!L){ return; }
    let gained=[];
    /* territory actually held changes hands */
    const seenS=new Set();
    const held=w.occ.filter(id=>{ if(seenS.has(id)) return false; seenS.add(id); return true; })
      .map(id=>SITES[id]).filter(s=>s&&s.alive&&lose.some(p=>p.id===s.polity));
    held.sort((a,b)=>b.pop-a.pop);
    const take=Math.min(held.length, Math.max(1,Math.round(Math.abs(w.score)/6)));
    for(let k=0;k<take;k++){
      const s=held[k];
      polityAdd(V,s);
      gained.push(s);
    }
    const cbk=w.cb;
    const crushing = Math.abs(w.score)>18 && polityStr(V) > polityStr(L)*2.2;
    if(((cbk==='claim'||cbk==='succession'||cbk==='crown')&&Math.abs(w.score)>16&&L.sites.length)
       || (crushing && L.liege<0 && V.liege<0 && L.sites.length)){
      /* the throne itself is brought under another crown */
      vassalize(L,V,year,true);
      chron(year,5,'submit',`${PL(L)} bends the knee to ${PL(V)}.`,{pols:[L.id,V.id],wars:[w.id]});
    } else if(cbk==='independence'&&victor>0){
      independence(A[0],year,'won by the sword');
    } else if(cbk==='tribute'&&victor>0){
      L.tributary=V.id;
      V.treasury+=40;
    }
    const tribute=Math.min(L.treasury*0.5, 250);
    L.treasury-=tribute; V.treasury+=tribute;
    V.truce.set(L.id,year+10); L.truce.set(V.id,year+10);
    setRelation(V,L,-45,'they took our land at the peace table',year,0.98);
    const lr=C(L.ruler), vr=C(V.ruler);
    if(lr&&vr){
      lr.grudge.push({c:vr.id,d:vr.dyn,w:40,y:year,why:'the peace of '+year});
      opine(lr,vr,-60,'humbled me',year);
      lr.prestige-=60; vr.prestige+=90;
    }
    for(const p of lose) p.legit=clamp(p.legit-0.10,0.05,1);
    for(const p of win) p.legit=clamp(p.legit+0.05,0.05,1);
    const fell=Math.round(w.atkCasualties+w.defCasualties);
    chron(year,5,'peace',
      `The ${cap(w.title)} ends. ${PL(V)} is victorious`+
      (gained.length? '; '+listify(gained.map(s=>SL(s)))+' pass'+(gained.length>1?'':'es')+' to '+PL(V) : ', though nothing changes hands')+
      `. `+(fell>20? plural(fell,'man','men')+' died.' : 'It was decided by marching, not by fighting.'),
      {pols:[V.id,L.id],wars:[w.id],sites:gained.map(s=>s.id)});
  }
  for(const p of A.concat(D)){
    const k=p.wars.indexOf(w.id); if(k>=0) p.wars.splice(k,1);
    p.levyPool=0;
  }
}

/* ------------------------------------------------------------- civil war    */
function startCivilWar(p,rebels,kind,year,r){
  const lead=rebels[0];
  const w={
    id:WARS.length, atk:rebels.map(q=>q.id), def:[p.id],
    cb: kind==='independence'?'independence':'depose',
    why: kind==='independence'? 'they will not kneel' : 'the crown is unfit',
    start:year, ended:-1, score:0, battles:[], sieges:[], occ:[], sacked:[],
    title:pick(r,['Rising','Revolt','Rebellion','Broken Oath','Anarchy','Troubles'])+' of '+p.name,
    atkCasualties:0, defCasualties:0, civil:1, target:p.id
  };
  WARS.push(w);
  p.wars.push(w.id);
  for(const q of rebels){ q.wars.push(w.id); raiseArmies(q,w,year,r); }
  raiseArmies(p,w,year,r);
  chron(year,5,'civil',
    `${listify(rebels.slice(0,3).map(q=>PL(q)))}${rebels.length>3?' and others':''} rise against ${PL(p)}. The ${cap(w.title)} begins.`,
    {pols:[p.id].concat(rebels.map(q=>q.id)),wars:[w.id]});
  const rl=C(lead.ruler); if(rl) addTrait(rl,'oathbreaker',year);
}

/* ------------------------------------------------------------- alliances    */
function diplomacyTick(p,year,r){
  if(!p.alive||p.liege>=0) return;
  decayRelations(p);
  if(p.ally!==undefined&&p.ally>=0){ const q=P(p.ally); if(!q||!q.alive) p.ally=-1; }
  if((p.ally===undefined||p.ally<0)&&chance(r,0.10)){
    const cands=[];
    for(const [k,e] of p.rel){
      const q=P(k);
      if(q&&q.alive&&q.liege<0&&(q.ally===undefined||q.ally<0)&&relation(p,q)>45&&!atWar(p.id,q.id)) cands.push(q);
    }
    if(cands.length){
      const q=pick(r,cands);
      p.ally=q.id; q.ally=p.id;
      setRelation(p,q,25,'we are allies',year);
      chron(year,3,'alliance',`${PL(p)} and ${PL(q)} swear an alliance.`,{pols:[p.id,q.id]});
    }
  }
  /* a small realm beside a very great one often decides that oaths are cheaper
     than sieges */
  if(p.liege<0&&p.sites.length>=4&&chance(r,0.05)){
    const mine=polityStr(p);
    for(const sid of p.sites){
      const s=SITES[sid]; let done=false;
      for(const l of s.links){
        const o=SITES[l.to]; const q=o&&P(o.polity);
        if(!q||!q.alive||q===p||q.liege>=0) continue;
        if(realmOf(q)===p) continue;
        if(polityStr(q)<mine*0.28 && relation(p,q)>-20 && !atWar(p.id,q.id)
           && q.sites.length<=p.sites.length*0.5){
          vassalize(q,p,YEAR,false);
          chron(YEAR,4,'submit',
            `${PL(q)}, weighing the size of its neighbour, swears to ${PL(p)} rather than be taken.`,
            {pols:[q.id,p.id]});
          done=true; break;
        }
      }
      if(done) break;
    }
  }
  p.warExhaust=clamp(p.warExhaust-0.030,0,1.4);
}
/* ============================================================================
   PART IX — DEEP TIME
   Before the years were counted, the world was broken and remade. What the
   Elder Age left behind is still on the map: scars, leylines, ruins, and
   things that were made to last longer than the hands that made them.
   ========================================================================== */

let MAGIC=1.0, MAGIC0=1.0;
let POWERS=[], CATACLYSMS=[], ARTS=[], RUINS=[], PROPHS=[], LEGENDS=[];

const SCAR_NONE=0,SCAR_SUNDER=1,SCAR_DROWN=2,SCAR_BURN=3,SCAR_FREEZE=4,SCAR_BLIGHT=5,SCAR_GLASS=6;
const SCARN=['','the Sundering','the Drowning','the Burning','the Long Cold','the Blight','the Glassing'];

/* --------------------------------------------------------- the Elder Age    */
/* Phase one runs *inside* worldgen, before climate and rivers, because what
   the Powers did to the rock changes where the rain falls afterwards.        */
function elderShape(seed){
  const r=stream(seed,'elder');
  POWERS=[]; CATACLYSMS=[]; ARTS=[]; RUINS=[];
  MAGIC0 = rf(r,0.85,1.25); MAGIC=MAGIC0;
  /* the primordial powers seat themselves where the world burns brightest */
  const leyRank=[];
  for(let i=0;i<NT;i+=2) if(T.land[i]&&T.ley[i]>0.85) leyRank.push(i);
  leyRank.sort((a,b)=>T.ley[b]-T.ley[a]);
  const np=ri(r,3,6);
  for(let k=0;k<np;k++){
    const seat = leyRank.length? leyRank[Math.min(leyRank.length-1, k*7+ri(r,0,5))] : ri(r,0,NT-1);
    const lang=LANGS[k%LANGS.length];
    const dom=pick(r,DOMAINS);
    const nm=lang.unique(sampleK(r,dom.t,2),{});
    POWERS.push({
      id:k, name:nm.t, gloss:nm.g, domain:dom.k, dname:dom.n, seat,
      alignment: chance(r,0.42)? 'shadow':'light',
      fate:'', bound:false, epoch:-ri(r,900,4000)
    });
  }
  /* cataclysms — these actually rewrite the map */
  const nc=ri(r,2,4);
  const kinds=[SCAR_SUNDER,SCAR_DROWN,SCAR_BURN,SCAR_FREEZE,SCAR_BLIGHT,SCAR_GLASS];
  shuffle(r,kinds);
  for(let k=0;k<nc;k++){
    const kind=kinds[k%kinds.length];
    const centre = pickCataclysmCentre(r,kind);
    const rad = ri(r,9,26);
    applyCataclysm(kind,centre,rad,r);
    const who = POWERS.length? pick(r,POWERS) : null;
    const lang=LANGS[k%LANGS.length];
    const nm=lang.unique([pick(r,['fire','death','shadow','ice','war','storm','deep','fate'])],{});
    CATACLYSMS.push({
      id:k, kind, name: SCARN[kind]+' of '+nm.t, centre, rad,
      year: -ri(r,300,3600), by: who? who.id : -1,
      tale: cataclysmTale(kind, who, r)
    });
    MAGIC0 -= rf(r,0.02,0.08);
  }
  MAGIC=MAGIC0=clamp(MAGIC0,0.45,1.3);
}

/* Phase two needs the finished map: it places ruins and buries things in them. */
function elderLore(seed){
  const r=stream(seed,'elderlore');
  /* elder ruins: cities that fell before the reckoning of years */
  const nr=ri(r,10,22);
  for(let k=0;k<nr;k++){
    let best=-1,bv=-1;
    for(let a=0;a<200;a++){
      const i=ri(r,0,NT-1);
      if(!T.land[i]) continue;
      const v=T.ley[i]*1.6+siteSuitability(i)*0.5+(T.scar[i]?0.6:0)-nearRuin(i)*2;
      if(v>bv){bv=v;best=i;}
    }
    if(best<0) continue;
    const lang=LANGS[ri(r,0,LANGS.length-1)];
    const nm=nameSettlement(lang,best,r,3);
    const ru={
      id:RUINS.length, tile:best, name:nm.t, gloss:nm.g, elder:true,
      year:-ri(r,200,3800), why:pick(r,['thrown down in the wars of the Powers','abandoned when the wells of power failed',
        'drowned and raised again','forsaken, and none say why','burned by its own people','swallowed and spat out by the earth']),
      lostTech: chance(r,0.5)? pick(r,TECHS.filter(t=>t.era<=3)).k : null,
      buried:[], looted:false, site:-1
    };
    T.ruin[best]=ru.id;
    RUINS.push(ru);
  }
  /* the great works of the Elder Age */
  const na=ri(r,6,12);
  for(let k=0;k<na;k++){
    const it=forgeArtifact(r,-ri(r,200,3600),null,null,true);
    if(RUINS.length&&chance(r,0.7)){
      const ru=pick(r,RUINS);
      if(it.made>=ru.year){ it.made=ru.year-ri(r,60,900); it.chain[0].y=it.made; }
      ru.buried.push(it.id); it.buried=ru.tile; it.lost=true;
      it.chain.push({y:ru.year,what:'lost in the fall of '+ru.name,where:ru.tile});
    }
  }
}
function nearRuin(i){
  let n=0;
  for(const ru of RUINS) if(tdist(ru.tile,i)<14) n++;
  return n;
}
function pickCataclysmCentre(r,kind){
  let best=-1,bv=-1e9;
  for(let a=0;a<600;a++){
    const i=ri(r,0,NT-1);
    let v=T.ley[i]*2;
    if(kind===SCAR_DROWN) v += T.land[i]&&T.alt[i]<0.15? 2:-2;
    if(kind===SCAR_SUNDER) v += T.land[i]&&T.alt[i]>0.30? 2:-2;
    if(kind===SCAR_FREEZE) v += Math.abs(latOf((i/W)|0))>0.5? 1.5:-1;
    if(kind===SCAR_BURN||kind===SCAR_GLASS) v += T.land[i]?1:-3;
    if(kind===SCAR_BLIGHT) v += T.land[i]&&T.fert[i]>0.4? 2:-2;
    if(v>bv){bv=v;best=i;}
  }
  return best;
}
function applyCataclysm(kind,centre,rad,r){
  const cx=centre%W, cy=(centre/W)|0;
  for(let dy=-rad;dy<=rad;dy++){
    const y=cy+dy; if(y<0||y>=H) continue;
    for(let dx=-rad;dx<=rad;dx++){
      const d=Math.hypot(dx,dy); if(d>rad) continue;
      const i=wrapx(cx+dx)+y*W;
      const f=1-d/rad;
      const n=fbm(i%W,(i/W)|0,12345,3,8.0);
      if(f*n*1.6<0.20) continue;
      T.scar[i]=kind;
      switch(kind){
        case SCAR_SUNDER:
          T.elev[i] += (n>0.5? f*0.30 : -f*0.26);
          break;
        case SCAR_DROWN:
          T.elev[i] -= f*0.24;
          break;
        case SCAR_BURN:
          T.elev[i] += f*0.06*(n-0.4);
          break;
        case SCAR_FREEZE: break;
        case SCAR_BLIGHT: break;
        case SCAR_GLASS:
          T.elev[i] -= f*0.05;
          break;
      }
    }
  }
  /* re-derive land/alt after the earth moved */
  const top=1-SEA;
  for(let i=0;i<NT;i++){
    const e=T.elev[i];
    T.land[i]= e>SEA?1:0;
    T.alt[i] = e>SEA? (e-SEA)/top : -(SEA-e)/(SEA||1);
  }
}
function cataclysmTale(kind,who,r){
  const w = who? who.name : 'something without a name';
  switch(kind){
    case SCAR_SUNDER: return `${w} broke the land as a man breaks bread, and the halves have never sat true since.`;
    case SCAR_DROWN:  return `The sea was called in by ${w}, and it came, and it did not go out again.`;
    case SCAR_BURN:   return `${w} set fire to the air itself. The ash fell for a year.`;
    case SCAR_FREEZE: return `${w} put out the sun for three winters. Nothing that grew then grows now.`;
    case SCAR_BLIGHT: return `Where ${w} walked, the corn went black in the ear.`;
    case SCAR_GLASS:  return `${w} was answered with a light, and the sand ran like water and set as glass.`;
  }
  return 'It is not remembered.';
}

/* --------------------------------------------------------------- artifacts  */

 'dragonbone','obsidian','moonstone','red bronze','glass that will not break','stone from the sky'];
const ART_POWER=[
